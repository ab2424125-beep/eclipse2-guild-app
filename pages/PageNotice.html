<!-- ==========================================
     [ECLIPSE 길드관리] 길드 공지사항 모듈
     경로: pages/PageNotice.html
     ========================================== -->
<style>
  .notice-card {
    background: rgba(18, 26, 45, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .notice-box {
    background: #0d1527;
    border: 1px solid #1e2c47;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }

  /* 일관된 다크 인풋 스타일 */
  .input-custom-notice {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    padding: 9px 12px !important;
    font-size: 0.85rem !important;
    color-scheme: dark;
    transition: all 0.15s ease;
  }
  .input-custom-notice:focus, .input-custom-notice:hover {
    border-color: #38bdf8 !important;
    outline: none !important;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.2) !important;
  }
  .input-custom-notice::placeholder {
    color: #64748b !important;
    opacity: 1 !important;
  }
  select.input-custom-notice option {
    background-color: #0d1527;
    color: #ffffff;
  }

  /* 헤더 유틸 버튼 */
  .btn-header-notice {
    background: #111a2e;
    border: 1px solid #233554;
    color: #94a3b8;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-header-notice:hover {
    border-color: #38bdf8;
    color: #ffffff;
  }

  /* 저장 버튼 그라데이션 */
  .btn-notice-submit {
    background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    border: none;
    color: #ffffff;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }
  .btn-notice-submit:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  /* 공지 리스트 카드 */
  .notice-item-card {
    background: #090e1c;
    border: 1px solid #1b263b;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.2s ease;
  }
  .notice-item-card:hover {
    border-color: rgba(56, 189, 248, 0.5);
    background: #0d162d;
  }
  .notice-item-card.is-important {
    border-color: rgba(239, 68, 68, 0.4);
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.06) 0%, #090e1c 100%);
  }

  /* 구분 뱃지 */
  .badge-notice-type {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .badge-type-normal {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38bdf8;
  }
  .badge-type-urgent {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #f87171;
  }
  .badge-type-event {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fbbf24;
  }

  /* 토스트 알림창 */
  .custom-notice-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #0d1830;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    color: #ffffff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.88rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .custom-notice-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="notice-card mb-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.3rem;">📢</span>
      <h6 class="fw-bold mb-0 text-white">길드 공지사항</h6>
    </div>
    <div class="d-flex gap-1">
      <button type="button" class="btn-header-notice" id="btnToggleNoticeForm" onclick="window.toggleNoticeRegisterForm()">
        <i class="fa-solid fa-pen me-1"></i>공지 등록
      </button>
      <button type="button" class="btn-header-notice" onclick="window.loadNoticeList()">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
    </div>
  </div>

  <!-- 신규 / 수정 공지사항 폼 -->
  <div class="notice-box border-info border-opacity-50" id="noticeRegisterBox" style="display: none; background: #0b1324;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="small fw-bold text-info" id="noticeFormTitle">
        <i class="fa-solid fa-pen-to-square me-1"></i> 신규 공지사항 등록
      </span>
      <button type="button" class="btn-close btn-close-white" style="font-size: 0.72rem;" onclick="window.closeNoticeForm()"></button>
    </div>

    <!-- 수정 대상 ID 보관 (신규 등록 시 비어있음) -->
    <input type="hidden" id="editingNoticeId" value="">

    <div class="row g-2 mb-2">
      <div class="col-4">
        <label class="form-label small text-secondary mb-1">구분</label>
        <select id="noticeTypeSelect" class="form-select input-custom-notice">
          <option value="일반">📢 일반</option>
          <option value="중요">🚨 중요/필독</option>
          <option value="이벤트">🎁 이벤트</option>
        </select>
      </div>
      <div class="col-4">
        <label class="form-label small text-secondary mb-1">작성자</label>
        <input type="text" id="noticeWriterInput" class="form-control input-custom-notice" placeholder="작성자 명">
      </div>
      <div class="col-4">
        <label class="form-label small text-secondary mb-1">공지 일자</label>
        <input type="date" id="noticeDateInput" class="form-control input-custom-notice">
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label small text-secondary mb-1">공지 제목</label>
      <input type="text" id="noticeTitleInput" class="form-control input-custom-notice" placeholder="제목을 입력하세요">
    </div>

    <div class="mb-3">
      <label class="form-label small text-secondary mb-1">공지 내용</label>
      <textarea id="noticeContentInput" class="form-control input-custom-notice" rows="4" placeholder="공지 내용을 자세히 입력하세요..." style="resize: vertical;"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-secondary btn-sm px-3" style="background:#1e293b; border-color:#334155; font-size: 0.85rem;" onclick="window.closeNoticeForm()">
        취소
      </button>
      <button type="button" class="btn btn-notice-submit flex-fill" id="btnNoticeSubmitAction" onclick="window.submitNoticeRecord()">
        <i class="fa-solid fa-check me-1"></i> 공지사항 저장하기
      </button>
    </div>
  </div>

  <!-- 상단 안내 인포바 -->
  <div class="p-2 px-3 rounded mb-3 d-flex align-items-center gap-2" style="background: rgba(14, 165, 233, 0.08); border: 1px solid rgba(56, 189, 248, 0.2);">
    <span>💡</span>
    <span class="small text-secondary" style="font-size: 0.76rem;">길드 중요 공지 및 전달사항이 실시간으로 안내됩니다.</span>
  </div>

  <!-- 공지사항 목록 컨테이너 -->
  <div id="noticeListContainer">
    <div class="text-secondary small text-center py-4">공지사항을 불러오는 중...</div>
  </div>
</div>

<!-- 플로팅 토스트 -->
<div id="noticeToastBox" class="custom-notice-toast">
  <span id="noticeToastIcon">✅</span>
  <span id="noticeToastMsg">알림</span>
</div>

<script>
  window.noticeToastTimer = null;
  window.cachedNoticesList = [];

  // 🧹 [메모리 클린업 등록]
  window.__currentModuleCleanup = function() {
    if (window.noticeToastTimer) {
      clearTimeout(window.noticeToastTimer);
      window.noticeToastTimer = null;
    }
  };

  window.showNoticeToast = function(msg, icon = "✅") {
    const toast = document.getElementById("noticeToastBox");
    const m = document.getElementById("noticeToastMsg");
    const ic = document.getElementById("noticeToastIcon");
    if (!toast) return;

    m.innerText = msg;
    ic.innerText = icon;
    toast.classList.add("show");

    if (window.noticeToastTimer) clearTimeout(window.noticeToastTimer);
    window.noticeToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  // 공지사항 작성/수정 권한 체크 함수
  async function checkNoticeWritePermission() {
    const isSuper = (sessionStorage.getItem("admin_role") === "super");
    if (isSuper) return true;

    try {
      const permRow = await apiRequest("guild_settings?key=eq.perm_notice_write");
      if (permRow && permRow.length > 0) {
        return permRow[0].value !== 'false';
      }
    } catch (e) {}
    return true;
  }

  function setNoticeDefaultValues() {
    const today = typeof getKSTDateString === "function" ? getKSTDateString() : new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('noticeDateInput');
    if (dateInput) dateInput.value = today;

    const writerInput = document.getElementById('noticeWriterInput');
    if (writerInput) {
      const loggedUser = sessionStorage.getItem("admin_user") || "길드장";
      writerInput.value = loggedUser;
    }
  }

  // 신규 공지 등록 폼 열기
  window.toggleNoticeRegisterForm = async function() {
    const hasPerm = await checkNoticeWritePermission();
    if (!hasPerm) {
      return window.showNoticeToast("공지사항 작성 권한이 비활성화되어 있습니다.", "⚠️");
    }

    const box = document.getElementById('noticeRegisterBox');
    const isOpening = (box.style.display === 'none' || !box.style.display);
    
    if (isOpening) {
      // 신규 등록 모드로 리셋
      document.getElementById('editingNoticeId').value = "";
      document.getElementById('noticeFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square me-1"></i> 신규 공지사항 등록';
      document.getElementById('btnNoticeSubmitAction').innerHTML = '<i class="fa-solid fa-check me-1"></i> 공지사항 저장하기';
      document.getElementById('noticeTitleInput').value = "";
      document.getElementById('noticeContentInput').value = "";
      document.getElementById('noticeTypeSelect').value = "일반";
      setNoticeDefaultValues();
      box.style.display = 'block';
      document.getElementById('noticeTitleInput').focus();
    } else {
      window.closeNoticeForm();
    }
  };

  window.closeNoticeForm = function() {
    const box = document.getElementById('noticeRegisterBox');
    if (box) box.style.display = 'none';
    document.getElementById('editingNoticeId').value = "";
  };

  // 🎯 [핵심 추가]: 공지사항 수정 모드로 전환
  window.editNoticeItem = async function(id) {
    const hasPerm = await checkNoticeWritePermission();
    if (!hasPerm) {
      return window.showNoticeToast("공지사항 수정 권한이 없습니다.", "⚠️");
    }

    const item = window.cachedNoticesList.find(n => n.id === id);
    if (!item) return window.showNoticeToast("수정할 공지사항 정보를 찾을 수 없습니다.", "⚠️");

    let rawTitle = item.title || '';
    let detectedType = '일반';

    if (rawTitle.startsWith('[중요]')) {
      detectedType = '중요';
      rawTitle = rawTitle.replace('[중요]', '').trim();
    } else if (rawTitle.startsWith('[필독]')) {
      detectedType = '중요';
      rawTitle = rawTitle.replace('[필독]', '').trim();
    } else if (rawTitle.startsWith('[이벤트]')) {
      detectedType = '이벤트';
      rawTitle = rawTitle.replace('[이벤트]', '').trim();
    } else if (rawTitle.startsWith('[일반]')) {
      detectedType = '일반';
      rawTitle = rawTitle.replace('[일반]', '').trim();
    }

    // 폼에 기존 내용 채우기
    document.getElementById('editingNoticeId').value = String(item.id);
    document.getElementById('noticeFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square me-1 text-warning"></i> 공지사항 내용 수정';
    document.getElementById('btnNoticeSubmitAction').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> 공지사항 수정 완료';

    document.getElementById('noticeTypeSelect').value = detectedType;
    document.getElementById('noticeTitleInput').value = rawTitle;
    document.getElementById('noticeContentInput').value = item.content || '';
    
    const dateStr = (item.created_at || item.date || '').slice(0, 10);
    if (dateStr) {
      document.getElementById('noticeDateInput').value = dateStr;
    }

    const box = document.getElementById('noticeRegisterBox');
    box.style.display = 'block';
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.getElementById('noticeTitleInput').focus();
  };

  // 공지사항 목록 조회
  window.loadNoticeList = async function() {
    const container = document.getElementById('noticeListContainer');
    if (container) {
      container.innerHTML = '<div class="text-secondary small text-center py-4"><i class="fa-solid fa-spinner fa-spin me-1"></i>공지사항을 불러오는 중...</div>';
    }

    try {
      const notices = await apiRequest("guild_notices?select=*&order=id.desc");
      window.cachedNoticesList = notices || [];

      if (!notices || notices.length === 0) {
        container.innerHTML = `
          <div class="text-secondary small text-center py-5">
            <div>등록된 공지사항이 없습니다.</div>
            <div class="mt-1" style="font-size: 0.75rem; color: #64748b;">우측 상단의 [+ 공지 등록]을 눌러 첫 공지를 작성해보세요!</div>
          </div>
        `;
        return;
      }

      const isAdmin = (typeof isAdminLoggedIn === "function") ? isAdminLoggedIn() : (sessionStorage.getItem("admin_auth") === "true");

      container.innerHTML = notices.map(item => {
        let rawTitle = item.title || '제목 없음';
        let detectedType = '일반';

        if (rawTitle.startsWith('[중요]') || rawTitle.startsWith('[필독]')) {
          detectedType = '중요';
          rawTitle = rawTitle.replace(/[중요]|[필독]/g, '').trim();
        } else if (rawTitle.startsWith('[이벤트]')) {
          detectedType = '이벤트';
          rawTitle = rawTitle.replace('[이벤트]', '').trim();
        } else if (rawTitle.startsWith('[일반]')) {
          detectedType = '일반';
          rawTitle = rawTitle.replace('[일반]', '').trim();
        }

        let badgeClass = 'badge-type-normal';
        let isImp = false;

        if (detectedType === '중요') {
          badgeClass = 'badge-type-urgent';
          isImp = true;
        } else if (detectedType === '이벤트') {
          badgeClass = 'badge-type-event';
        }

        const dateStr = (item.created_at || item.date || '').slice(0, 10);
        const writer = item.writer || item.author || '관리자';
        const content = (item.content || '').replace(/\n/g, '<br>');

        // 🎯 [삭제] 옆에 [수정] 버튼 배치
        const actionTools = isAdmin ? `
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-link btn-xs p-0 text-info" style="font-size: 0.72rem; text-decoration: none;" onclick="window.editNoticeItem(${item.id})">
              <i class="fa-solid fa-pen-to-square me-1"></i>수정
            </button>
            <button type="button" class="btn btn-link btn-xs p-0 text-danger" style="font-size: 0.72rem; text-decoration: none;" onclick="window.deleteNoticeItem(${item.id})">
              <i class="fa-solid fa-trash me-1"></i>삭제
            </button>
          </div>
        ` : '';

        return `
          <div class="notice-item-card ${isImp ? 'is-important' : ''}">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="d-flex align-items-center gap-2">
                <span class="badge-notice-type ${badgeClass}">${detectedType}</span>
                <span class="fw-bold text-white small">${rawTitle}</span>
              </div>
              <span class="text-secondary" style="font-size: 0.72rem;">${dateStr}</span>
            </div>
            <div class="text-secondary mb-2" style="font-size: 0.8rem; line-height: 1.6; color: #cbd5e1 !important;">
              ${content}
            </div>
            <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-25" style="font-size: 0.7rem;">
              <span class="text-secondary">작성자: <strong class="text-info">${writer}</strong></span>
              ${actionTools}
            </div>
          </div>
        `;
      }).join('');

    } catch (err) {
      if (container) {
        container.innerHTML = `<div class="text-danger small text-center py-4">공지사항 조회 실패: ${err.message}</div>`;
      }
    }
  };

  // 🎯 공지사항 신규 등록 또는 수정 저장
  window.submitNoticeRecord = async function() {
    const hasPerm = await checkNoticeWritePermission();
    if (!hasPerm) {
      return window.showNoticeToast("공지사항 작성/수정 권한이 없습니다.", "⚠️");
    }

    const editId = document.getElementById('editingNoticeId').value.trim();
    const type = document.getElementById('noticeTypeSelect').value;
    const title = (document.getElementById('noticeTitleInput').value || '').trim();
    const content = (document.getElementById('noticeContentInput').value || '').trim();

    if (!title) return window.showNoticeToast("공지 제목을 입력해주세요!", "⚠️");
    if (!content) return window.showNoticeToast("공지 내용을 입력해주세요!", "⚠️");

    const btn = document.getElementById('btnNoticeSubmitAction');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>처리 중...';

    try {
      const formattedTitle = `[${type}] ${title}`;

      if (editId) {
        // [수정 UPDATE 모드]
        await apiRequest(`guild_notices?id=eq.${editId}`, "PATCH", {
          title: formattedTitle,
          content: content
        });
        window.showNoticeToast("공지사항이 성공적으로 수정되었습니다!", "🎉");
      } else {
        // [신규 INSERT 모드]
        await apiRequest("guild_notices", "POST", [{
          title: formattedTitle,
          content: content
        }]);
        window.showNoticeToast("공지사항이 성공적으로 등록되었습니다!", "🎉");
      }

      window.closeNoticeForm();
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> 공지사항 저장하기';

      await window.loadNoticeList();
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> 공지사항 저장하기';
      window.showNoticeToast("저장 실패: " + err.message, "❌");
    }
  };

  // 공지사항 삭제 처리
  window.deleteNoticeItem = async function(id) {
    if (!confirm("해당 공지사항을 삭제하시겠습니까?")) return;

    try {
      await apiRequest(`guild_notices?id=eq.${id}`, "DELETE");
      window.showNoticeToast("공지사항이 삭제되었습니다.", "🗑️");
      await window.loadNoticeList();
    } catch (err) {
      window.showNoticeToast("삭제 실패: " + err.message, "❌");
    }
  };

  (function initNoticeModule() {
    setNoticeDefaultValues();
    window.loadNoticeList();
  })();
</script>
