<!-- ==========================================
     [ECLIPSE 길드관리] 시스템 및 환경 설정 모듈
     경로: pages/PageSettings.html
     ========================================== -->
<style>
  .settings-card {
    background: rgba(18, 26, 45, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .settings-box {
    background: #0d1527;
    border: 1px solid #1e2c47;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .input-custom-settings {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    padding: 8px 12px !important;
    font-size: 0.85rem !important;
    color-scheme: dark;
    transition: all 0.15s ease;
  }
  .input-custom-settings:focus {
    border-color: #38bdf8 !important;
    outline: none !important;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.2) !important;
  }
  .input-custom-settings::placeholder {
    color: #64748b !important;
    opacity: 1 !important;
  }

  .form-check-input {
    background-color: #1e293b;
    border-color: #334155;
    cursor: pointer;
  }
  .form-check-input:checked {
    background-color: #0ea5e9;
    border-color: #38bdf8;
  }

  .btn-settings-save {
    background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    border: none;
    color: #ffffff;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }
  .btn-settings-save:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  /* 커스텀 토스트 알림창 */
  .custom-settings-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #0d1830;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    color: #ffffff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.88rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
  }
  .custom-settings-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>

<div class="settings-card mb-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.3rem;">⚙️</span>
      <h6 class="fw-bold mb-0 text-white">시스템 및 환경 설정</h6>
    </div>
    <span class="badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.72rem;" id="adminRoleBadge">
      최고 관리자
    </span>
  </div>

  <!-- 1. 길드 기본 정보 설정 -->
  <div class="settings-box">
    <div class="small fw-bold text-white mb-2"><i class="fa-solid fa-shield-halved me-1 text-info"></i> 길드 기본 정보</div>
    <div class="mb-3">
      <label class="form-label small text-secondary mb-1">길드 이름</label>
      <input type="text" id="settingGuildName" class="form-control input-custom-settings" placeholder="길드 이름을 입력하세요 (예: ECLIPSE)">
    </div>
    <button type="button" class="btn btn-settings-save w-100" onclick="window.saveGuildBaseSettings()">
      <i class="fa-solid fa-floppy-disk me-1"></i> 길드 기본 정보 저장
    </button>
  </div>

  <!-- 2. 모듈별 기능 권한 제어 -->
  <div class="settings-box">
    <div class="small fw-bold text-white mb-2"><i class="fa-solid fa-lock me-1 text-warning"></i> 모듈 및 기능 권한 제어</div>
    
    <!-- 📢 공지사항 작성 권한 토글 -->
    <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary border-opacity-25">
      <div>
        <div class="text-white small fw-bold">📢 공지사항 작성 권한</div>
        <div class="text-secondary" style="font-size: 0.72rem;">일반 관리자의 공지사항 신규 등록 가능 여부를 제어합니다.</div>
      </div>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" id="permNoticeWriteToggle" onchange="window.saveNoticePermission(this.checked)">
      </div>
    </div>

    <!-- 🎁 아이템 분배/낙찰 권한 토글 -->
    <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary border-opacity-25">
      <div>
        <div class="text-white small fw-bold">🎁 분배희망신청 권한</div>
        <div class="text-secondary" style="font-size: 0.72rem;">아이템 분배 및 낙찰 처리 기능 사용 여부를 제어합니다.</div>
      </div>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" id="permWishDistributeToggle" onchange="window.saveWishPermission(this.checked)">
      </div>
    </div>

    <!-- 💰 길드자금 분배 집행 권한 토글 -->
    <div class="d-flex justify-content-between align-items-center py-2">
      <div>
        <div class="text-white small fw-bold">💰 길드자금 분배 집행 권한</div>
        <div class="text-secondary" style="font-size: 0.72rem;">정산 탭에서 금고 분배 집행 폼을 열고 실행할 수 있는 권한입니다.</div>
      </div>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" id="permSettleDistributeToggle" onchange="window.saveSettlePermission(this.checked)">
      </div>
    </div>
  </div>

  <!-- 3. 관리자 비밀번호 변경 -->
  <div class="settings-box mb-0">
    <div class="small fw-bold text-white mb-2"><i class="fa-solid fa-key me-1 text-danger"></i> 관리자 접속 비밀번호 변경</div>
    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label small text-secondary mb-1">새 비밀번호</label>
        <input type="password" id="newAdminPassword" class="form-control input-custom-settings" placeholder="새 비밀번호 입력">
      </div>
      <div class="col-6">
        <label class="form-label small text-secondary mb-1">비밀번호 확인</label>
        <input type="password" id="confirmAdminPassword" class="form-control input-custom-settings" placeholder="새 비밀번호 재입력">
      </div>
    </div>
    <button type="button" class="btn btn-outline-danger btn-sm w-100 fw-bold py-2" onclick="window.changeAdminPassword()">
      <i class="fa-solid fa-lock me-1"></i> 비밀번호 변경 적용
    </button>
  </div>
</div>

<!-- 플로팅 토스트 -->
<div id="settingsToastBox" class="custom-settings-toast">
  <span id="settingsToastIcon">✅</span>
  <span id="settingsToastMsg">설정이 저장되었습니다.</span>
</div>

<script>
  window.settingsToastTimer = null;

  window.showSettingsToast = function(msg, icon = "✅") {
    const toast = document.getElementById("settingsToastBox");
    const m = document.getElementById("settingsToastMsg");
    const ic = document.getElementById("settingsToastIcon");
    if (!toast) return;

    m.innerText = msg;
    ic.innerText = icon;
    toast.classList.add("show");

    if (window.settingsToastTimer) clearTimeout(window.settingsToastTimer);
    window.settingsToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  // 🎯 설정값 로드
  window.loadSystemSettings = async function() {
    try {
      const rows = await apiRequest("guild_settings?select=*");
      const settingsMap = {};
      (rows || []).forEach(r => {
        settingsMap[r.key] = r.value;
      });

      // 1. 길드명 설정
      const guildName = settingsMap["guild_name"] || "ECLIPSE";
      document.getElementById("settingGuildName").value = guildName;
      sessionStorage.setItem("guild_name", guildName);

      // 2. 권한 토글 설정
      const permNotice = (settingsMap["perm_notice_write"] !== 'false');
      const permWish = (settingsMap["perm_wish_distribute"] !== 'false');
      const permSettle = (settingsMap["perm_settle_distribute"] !== 'false');

      document.getElementById("permNoticeWriteToggle").checked = permNotice;
      document.getElementById("permWishDistributeToggle").checked = permWish;
      document.getElementById("permSettleDistributeToggle").checked = permSettle;

      // 3. 관리자 뱃지
      const isSuper = (sessionStorage.getItem("admin_role") === "super");
      const badge = document.getElementById("adminRoleBadge");
      if (badge) {
        badge.innerText = isSuper ? "최고 관리자" : "일반 관리자";
      }

    } catch (err) {
      window.showSettingsToast("설정 로드 실패: " + err.message, "❌");
    }
  };

  // 🎯 길드 기본 정보 저장
  window.saveGuildBaseSettings = async function() {
    const nameVal = (document.getElementById("settingGuildName").value || "").trim();
    if (!nameVal) return window.showSettingsToast("길드 이름을 입력해주세요.", "⚠️");

    try {
      await apiRequest("guild_settings", "POST", [{
        key: "guild_name",
        value: nameVal
      }], { on_conflict: "key" });

      sessionStorage.setItem("guild_name", nameVal);
      window.showSettingsToast(`길드명이 [${nameVal}]으로 저장되었습니다!`, "🎉");
    } catch (err) {
      window.showSettingsToast("저장 실패: " + err.message, "❌");
    }
  };

  // 🎯 공지사항 작성 권한 토글 저장
  window.saveNoticePermission = async function(isChecked) {
    try {
      await apiRequest("guild_settings", "POST", [{
        key: "perm_notice_write",
        value: isChecked ? "true" : "false"
      }], { on_conflict: "key" });

      window.showSettingsToast(isChecked ? "공지사항 작성이 허용되었습니다." : "공지사항 작성이 비활성화되었습니다.", "📢");
    } catch (err) {
      window.showSettingsToast("권한 저장 실패: " + err.message, "❌");
    }
  };

  // 🎯 분배희망신청 권한 토글 저장
  window.saveWishPermission = async function(isChecked) {
    try {
      await apiRequest("guild_settings", "POST", [{
        key: "perm_wish_distribute",
        value: isChecked ? "true" : "false"
      }], { on_conflict: "key" });

      window.showSettingsToast(isChecked ? "분배희망신청이 활성화되었습니다." : "분배희망신청이 비활성화되었습니다.", "🎁");
    } catch (err) {
      window.showSettingsToast("권한 저장 실패: " + err.message, "❌");
    }
  };

  // 🎯 길드자금 분배 집행 권한 토글 저장
  window.saveSettlePermission = async function(isChecked) {
    try {
      await apiRequest("guild_settings", "POST", [{
        key: "perm_settle_distribute",
        value: isChecked ? "true" : "false"
      }], { on_conflict: "key" });

      window.showSettingsToast(isChecked ? "길드자금 분배가 활성화되었습니다." : "길드자금 분배가 비활성화되었습니다.", "💰");
    } catch (err) {
      window.showSettingsToast("권한 저장 실패: " + err.message, "❌");
    }
  };

  // 🎯 관리자 비밀번호 변경
  window.changeAdminPassword = async function() {
    const newPw = document.getElementById("newAdminPassword").value;
    const confirmPw = document.getElementById("confirmAdminPassword").value;

    if (!newPw) return window.showSettingsToast("새 비밀번호를 입력해주세요.", "⚠️");
    if (newPw !== confirmPw) return window.showSettingsToast("비밀번호가 일치하지 않습니다.", "⚠️");

    try {
      await apiRequest("guild_settings", "POST", [{
        key: "admin_password",
        value: newPw
      }], { on_conflict: "key" });

      window.showSettingsToast("관리자 비밀번호가 성공적으로 변경되었습니다!", "🔐");
      document.getElementById("newAdminPassword").value = '';
      document.getElementById("confirmAdminPassword").value = '';
    } catch (err) {
      window.showSettingsToast("비밀번호 변경 실패: " + err.message, "❌");
    }
  };

  // 🎯 초기 실행
  (function initSettingsModule() {
    window.loadSystemSettings();
  })();
</script>
