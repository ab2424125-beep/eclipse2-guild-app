<!-- ==========================================
     [ECLIPSE 길드관리] 길드 비용 및 금고 현황
     경로: pages/PageFinances.html
     ========================================== -->
<style>
  .finance-card-main {
    background: rgba(18, 26, 45, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .finance-balance-banner {
    background: linear-gradient(135deg, #0d172a 0%, #172554 100%);
    border: 1.5px solid rgba(56, 189, 248, 0.3);
    border-radius: 16px;
    padding: 18px 16px;
    text-align: center;
    margin-bottom: 14px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
  }

  .finance-section-box {
    background: #080d1a;
    border: 1px solid #1e2c47;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .btn-period-pill {
    background: #111a2e;
    border: 1px solid #233554;
    color: #94a3b8;
    font-size: 0.74rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-period-pill:hover { border-color: #38bdf8; color: #fff; }
  .btn-period-pill.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
    font-weight: 800;
  }

  .input-custom-fin {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    padding: 8px 12px !important;
    font-size: 0.85rem !important;
    color-scheme: dark;
  }

  .btn-fin-mode {
    flex: 1;
    background: #0d1527;
    border: 1px solid #1e2c47;
    color: #94a3b8;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 9px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .btn-fin-mode.active-in {
    background: rgba(16, 185, 129, 0.15);
    border-color: #10b981;
    color: #34d399;
    font-weight: 800;
  }
  .btn-fin-mode.active-out {
    background: rgba(239, 68, 68, 0.15);
    border-color: #ef4444;
    color: #f87171;
    font-weight: 800;
  }

  .finance-history-item {
    background: #090e1c;
    border: 1px solid #1b263b;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .custom-fin-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #0d1830;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    color: #ffffff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.88rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .custom-fin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="finance-card-main mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.3rem;">🏛️</span>
      <h6 class="fw-bold mb-0 text-white">길드 비용 및 금고 현황</h6>
    </div>
    <div class="d-flex gap-1">
      <button type="button" class="btn btn-outline-info btn-xs py-1 px-2" style="font-size: 0.74rem;" onclick="window.copyFinancesToKakao()">
        <i class="fa-solid fa-share-nodes me-1"></i>카톡 복사
      </button>
    </div>
  </div>

  <!-- 현재 길드 금고 보유액 배너 -->
  <div class="finance-balance-banner">
    <div class="small text-secondary mb-1">현재 길드 금고 보유액</div>
    <div class="fw-bold text-warning mb-2" style="font-size: 1.6rem;" id="vaultTotalBalanceText">0 다이아</div>
    <div class="small d-flex justify-content-center gap-3 text-secondary" style="font-size: 0.76rem;">
      <span>누적 적립: <strong class="text-success" id="vaultTotalDepositText">+0</strong></span>
      <span>누적 지출: <strong class="text-danger" id="vaultTotalWithdrawText">-0</strong></span>
    </div>
  </div>

  <!-- 주간/기간 수익금 필터 -->
  <div class="finance-section-box">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small fw-bold text-white"><i class="fa-solid fa-filter me-1 text-info"></i> 주간/기간 수익금 필터</span>
      <span class="small text-secondary" style="font-size: 0.72rem;">기간 수익: <strong class="text-warning" id="periodNetProfitText">0 다이아</strong></span>
    </div>

    <div class="d-flex gap-1 mb-2">
      <button type="button" class="btn-period-pill" onclick="window.setFinFilterPeriod('thisWeek', this)">이번 주</button>
      <button type="button" class="btn-period-pill" onclick="window.setFinFilterPeriod('lastWeek', this)">지난 주</button>
      <button type="button" class="btn-period-pill" onclick="window.setFinFilterPeriod('thisMonth', this)">이번 달</button>
      <button type="button" class="btn-period-pill active" onclick="window.setFinFilterPeriod('all', this)">전체</button>
    </div>

    <div class="row g-2 align-items-center mb-2">
      <div class="col-5">
        <input type="date" id="finStartDate" class="form-control input-custom-fin py-1 px-2" style="font-size:0.75rem;">
      </div>
      <div class="col-2 text-center text-secondary small">~</div>
      <div class="col-5">
        <input type="date" id="finEndDate" class="form-control input-custom-fin py-1 px-2" style="font-size:0.75rem;">
      </div>
    </div>

    <button type="button" class="btn btn-outline-info btn-sm w-100 fw-bold" style="font-size: 0.78rem;" onclick="window.loadFinanceLogs()">
      <i class="fa-solid fa-magnifying-glass me-1"></i> 지정 기간 내역 조회
    </button>
  </div>

  <!-- 입금 / 지출 수동 등록 섹션 (관리자 기능) -->
  <div class="finance-section-box">
    <div class="d-flex gap-2 mb-2">
      <button type="button" class="btn-fin-mode active-in" id="modeBtnDeposit" onclick="window.switchFinMode('deposit')">
        <i class="fa-solid fa-circle-plus me-1"></i> 수익금 입금 등록
      </button>
      <button type="button" class="btn-fin-mode" id="modeBtnWithdraw" onclick="window.switchFinMode('withdraw')">
        <i class="fa-solid fa-circle-minus me-1"></i> 길드 지출 등록
      </button>
    </div>

    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label small text-secondary mb-1">분류</label>
        <select id="finCategorySelect" class="form-select input-custom-fin">
          <option value="경매낙찰">경매낙찰 길드비</option>
          <option value="길드후원">길드원 자발후원</option>
          <option value="기타입금">기타 입금</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label small text-secondary mb-1">금액 (다이아)</label>
        <input type="number" id="finAmountInput" class="form-control input-custom-fin" placeholder="예: 5000">
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label small text-secondary mb-1">사유 / 적요 (reason)</label>
      <input type="text" id="finReasonInput" class="form-control input-custom-fin" placeholder="예: 길드 자금 보충, 이벤트 지원 등">
    </div>

    <button type="button" class="btn btn-primary btn-sm w-100 fw-bold py-2" id="btnSubmitFinAction" onclick="window.submitManualFinance()">
      <i class="fa-solid fa-check me-1"></i> 금고에 반영 처리
    </button>
  </div>

  <!-- 금고 입출금 상세 내역 -->
  <div class="finance-section-box mb-0">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small fw-bold text-secondary">📜 금고 입출금 상세 내역</span>
      <button type="button" class="btn btn-outline-secondary btn-xs py-0 px-2" style="font-size: 0.72rem;" onclick="window.loadFinanceLogs()">
        <i class="fa-solid fa-arrows-rotate me-1"></i>새로고침
      </button>
    </div>
    <div id="financeHistoryContainer" style="max-height: 280px; overflow-y: auto;">
      <div class="text-secondary small text-center py-3">내역을 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 플로팅 토스트 -->
<div id="finToastBox" class="custom-fin-toast">
  <span id="finToastIcon">✅</span>
  <span id="finToastMsg">알림</span>
</div>

<script>
  window.currentFinMode = 'deposit';
  window.finHistoryData = [];
  window.finToastTimer = null;

  window.showFinToast = function(msg, icon = "✅") {
    const toast = document.getElementById("finToastBox");
    const m = document.getElementById("finToastMsg");
    const ic = document.getElementById("finToastIcon");
    if (!toast) return;

    m.innerText = msg;
    ic.innerText = icon;
    toast.classList.add("show");

    if (window.finToastTimer) clearTimeout(window.finToastTimer);
    window.finToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  window.switchFinMode = function(mode) {
    window.currentFinMode = mode;
    const btnIn = document.getElementById('modeBtnDeposit');
    const btnOut = document.getElementById('modeBtnWithdraw');
    const catSelect = document.getElementById('finCategorySelect');
    const submitBtn = document.getElementById('btnSubmitFinAction');

    if (mode === 'deposit') {
      btnIn.className = 'btn-fin-mode active-in';
      btnOut.className = 'btn-fin-mode';
      catSelect.innerHTML = `
        <option value="경매낙찰">경매낙찰 길드비</option>
        <option value="길드후원">길드원 자발후원</option>
        <option value="기타입금">기타 입금</option>
      `;
      submitBtn.className = 'btn btn-success btn-sm w-100 fw-bold py-2';
      submitBtn.innerHTML = '<i class="fa-solid fa-plus me-1"></i> 금고에 수익 입금 처리';
    } else {
      btnIn.className = 'btn-fin-mode';
      btnOut.className = 'btn-fin-mode active-out';
      catSelect.innerHTML = `
        <option value="N/1분배">N/1 정산 배당금 지급</option>
        <option value="이벤트지원">길드 이벤트/소모품 지원</option>
        <option value="기타지출">기타 운영비 지출</option>
      `;
      submitBtn.className = 'btn btn-danger btn-sm w-100 fw-bold py-2';
      submitBtn.innerHTML = '<i class="fa-solid fa-minus me-1"></i> 금고에서 지출 처리';
    }
  };

  window.setFinFilterPeriod = function(type, elem) {
    document.querySelectorAll(".btn-period-pill").forEach(p => p.classList.remove("active"));
    if (elem) elem.classList.add("active");

    const startInput = document.getElementById("finStartDate");
    const endInput = document.getElementById("finEndDate");
    const now = new Date();
    const pad = n => (n < 10 ? '0' + n : n);
    const toYmd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    if (type === "all") {
      startInput.value = "";
      endInput.value = "";
    } else if (type === "thisWeek") {
      const day = now.getDay() || 7;
      const mon = new Date(now);
      mon.setDate(now.getDate() - day + 1);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      startInput.value = toYmd(mon);
      endInput.value = toYmd(sun);
    } else if (type === "lastWeek") {
      const day = now.getDay() || 7;
      const lastMon = new Date(now);
      lastMon.setDate(now.getDate() - day - 6);
      const lastSun = new Date(lastMon);
      lastSun.setDate(lastMon.getDate() + 6);
      startInput.value = toYmd(lastMon);
      endInput.value = toYmd(lastSun);
    } else if (type === "thisMonth") {
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      startInput.value = toYmd(first);
      endInput.value = toYmd(last);
    }

    window.loadFinanceLogs();
  };

  // 🎯 guild_finances 데이터 로드 및 잔액 계산
  window.loadFinanceLogs = async function() {
    const container = document.getElementById("financeHistoryContainer");
    if (container) {
      container.innerHTML = '<div class="text-secondary small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>내역을 불러오는 중...</div>';
    }

    const startVal = document.getElementById("finStartDate").value;
    const endVal = document.getElementById("finEndDate").value;

    try {
      // tx_type, category, amount, reason 실제 컬럼 전체 조회
      const logs = await apiRequest("guild_finances?select=*&order=id.desc");
      window.finHistoryData = logs || [];

      let totalDeposit = 0;
      let totalWithdraw = 0;

      // 전체 누적 금고 잔액 계산
      window.finHistoryData.forEach(item => {
        const amt = Number(item.amount) || 0;
        const type = (item.tx_type || item.type || '');
        if (type === '입금') {
          totalDeposit += amt;
        } else if (type === '출금') {
          totalWithdraw += amt;
        }
      });

      const currentBalance = totalDeposit - totalWithdraw;
      document.getElementById("vaultTotalBalanceText").innerText = `${currentBalance.toLocaleString()} 다이아`;
      document.getElementById("vaultTotalDepositText").innerText = `+${totalDeposit.toLocaleString()}`;
      document.getElementById("vaultTotalWithdrawText").innerText = `-${totalWithdraw.toLocaleString()}`;

      // 기간 필터링 적용
      let filtered = window.finHistoryData;
      if (startVal || endVal) {
        filtered = filtered.filter(item => {
          const itemDate = (item.created_at || '').slice(0, 10);
          if (startVal && itemDate < startVal) return false;
          if (endVal && itemDate > endVal) return false;
          return true;
        });
      }

      // 기간 순수익 집계
      let pIn = 0, pOut = 0;
      filtered.forEach(it => {
        const amt = Number(it.amount) || 0;
        const type = (it.tx_type || it.type || '');
        if (type === '입금') pIn += amt;
        else if (type === '출금') pOut += amt;
      });
      document.getElementById("periodNetProfitText").innerText = `${(pIn - pOut).toLocaleString()} 다이아`;

      // 목록 렌더링
      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-secondary small text-center py-3">해당 기간의 금고 내역이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const type = (item.tx_type || item.type || '입금');
        const isDep = (type === '입금');
        const amt = Number(item.amount) || 0;
        const badgeClass = isDep ? 'bg-success bg-opacity-25 text-success' : 'bg-danger bg-opacity-25 text-danger';
        const sign = isDep ? '+' : '-';
        const reason = item.reason || item.memo || item.description || '-';
        const dateStr = (item.created_at || '').slice(0, 10);

        return `
          <div class="finance-history-item">
            <div style="min-width: 0; flex: 1;">
              <div class="fw-bold text-white small text-truncate d-flex align-items-center gap-1">
                <span class="badge ${badgeClass}" style="font-size: 0.65rem;">${type} • ${item.category || '기타'}</span>
                <span class="text-truncate">${reason}</span>
              </div>
              <div class="text-secondary mt-1" style="font-size: 0.7rem;">${dateStr}</div>
            </div>
            <div class="text-end" style="white-space: nowrap; margin-left: 10px;">
              <span class="fw-bold ${isDep ? 'text-success' : 'text-danger'}" style="font-size: 0.9rem;">
                ${sign}${amt.toLocaleString()} D
              </span>
            </div>
          </div>
        `;
      }).join('');

    } catch (err) {
      if (container) {
        container.innerHTML = `<div class="text-danger small text-center py-3">조회 실패: ${err.message}</div>`;
      }
    }
  };

  // 🎯 수동 입출금 등록
  window.submitManualFinance = async function() {
    const isSuper = (sessionStorage.getItem("admin_role") === "super");
    if (!isSuper) {
      return window.showFinToast("금고 입출금 등록은 관리자 권한이 필요합니다.", "⚠️");
    }

    const amount = parseInt(document.getElementById("finAmountInput").value) || 0;
    const category = document.getElementById("finCategorySelect").value;
    const reason = (document.getElementById("finReasonInput").value || "").trim();

    if (!amount || amount <= 0) return window.showFinToast("금액을 정확히 입력해주세요.", "⚠️");
    if (!reason) return window.showFinToast("사유(적요)를 입력해주세요.", "⚠️");

    const submitBtn = document.getElementById("btnSubmitFinAction");
    submitBtn.disabled = true;

    try {
      const typeStr = (window.currentFinMode === 'deposit') ? '입금' : '출금';

      // tx_type, category, amount, reason 전달
      await apiRequest("guild_finances", "POST", [{
        tx_type: typeStr,
        category: category,
        amount: amount,
        reason: reason
      }]);

      window.showFinToast(`금고에 ${typeStr} 처리가 완료되었습니다!`, "🎉");
      document.getElementById("finAmountInput").value = '';
      document.getElementById("finReasonInput").value = '';

      submitBtn.disabled = false;
      await window.loadFinanceLogs();
    } catch (err) {
      submitBtn.disabled = false;
      window.showFinToast("등록 실패: " + err.message, "❌");
    }
  };

  // 🎯 금고 현황 카카오톡 복사
  window.copyFinancesToKakao = function() {
    const balance = document.getElementById("vaultTotalBalanceText").innerText;
    const dep = document.getElementById("vaultTotalDepositText").innerText;
    const wth = document.getElementById("vaultTotalWithdrawText").innerText;
    const netProfit = document.getElementById("periodNetProfitText").innerText;

    let text = `[🏛️ ECLIPSE 길드 금고 및 비용 현황]\n` +
      `• 현재 금고 잔액: ${balance}\n` +
      `• 누적 적립액: ${dep} 다이아\n` +
      `• 누적 지출액: ${wth} 다이아\n` +
      `• 지정 기간 수익: ${netProfit}\n` +
      `────────────────\n` +
      `※ 정산 및 분배 내역이 실시간 반영된 결과입니다.`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
      window.showFinToast("금고 현황이 복사되었습니다!", "📋");
    }
  };

  // 🎯 모듈 초기 실행
  (function initFinanceModule() {
    window.loadFinanceLogs();
  })();
</script>
