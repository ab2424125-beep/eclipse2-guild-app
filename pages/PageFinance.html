<!-- ==========================================
     [ECLIPSE 길드관리] 길드 비용 및 금고 입출금 관리
     경로: pages/PageFinance.html
     ========================================== -->
<style>
  .finance-card {
    background: rgba(18, 26, 45, 0.9);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .finance-box {
    background: #0d1527;
    border: 1px solid #1e2c47;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .input-custom-finance {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    padding: 8px 10px !important;
    font-size: 0.85rem !important;
    color-scheme: dark;
  }
  .input-custom-finance::-webkit-calendar-picker-indicator {
    filter: invert(0.8) sepia(100%) saturate(300%) hue-rotate(175deg);
    cursor: pointer;
  }

  .quick-filter-btn {
    background: #111a2e;
    border: 1px solid #233554;
    color: #94a3b8;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 8px;
    border-radius: 8px;
    transition: all 0.15s;
    cursor: pointer;
  }
  .quick-filter-btn:hover, .quick-filter-btn.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
  }

  .tx-item-card {
    background: #0e172a;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.15s ease;
  }
  .tx-item-card:hover {
    border-color: #38bdf8;
    background: #14223d;
  }

  .tx-modal-bg {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .tx-modal-box {
    background: #0d1527;
    border: 1px solid #233b66;
    border-radius: 18px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    overflow: hidden;
  }
</style>

<div class="finance-card mb-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.3rem;">🏦</span>
      <h6 class="fw-bold mb-0 text-white">길드 금고 및 비용 현황</h6>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-outline-success btn-xs py-1 px-2" style="font-size: 0.75rem;" onclick="window.openTxModal('입금')">
        <i class="fa-solid fa-plus me-1"></i>입금 등록
      </button>
      <button class="btn btn-outline-danger btn-xs py-1 px-2" style="font-size: 0.75rem;" onclick="window.openTxModal('출금')">
        <i class="fa-solid fa-minus me-1"></i>출금 등록
      </button>
    </div>
  </div>

  <!-- 금고 잔액 대시보드 -->
  <div class="p-3 mb-3 rounded" style="background: linear-gradient(135deg, rgba(2, 132, 199, 0.2), rgba(245, 158, 11, 0.15)); border: 1px solid rgba(56, 189, 248, 0.4);">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <div class="text-secondary small" style="font-size: 0.75rem;">현재 길드 금고 잔액</div>
        <div class="fw-bold text-white fs-4"><span id="finVaultBalance" class="text-warning">0</span> <small class="fs-6">다이아</small></div>
      </div>
      <div class="text-end">
        <div class="text-secondary small" style="font-size: 0.72rem;">총 입금: <strong class="text-success" id="finTotalIn">0</strong> D</div>
        <div class="text-secondary small" style="font-size: 0.72rem;">총 출금: <strong class="text-danger" id="finTotalOut">0</strong> D</div>
      </div>
    </div>
  </div>

  <!-- 날짜 필터 -->
  <div class="finance-box">
    <div class="d-flex gap-1 mb-2">
      <button class="quick-filter-btn" id="fBtnThisWeek" onclick="window.setFinQuickRange('thisWeek')">이번 주</button>
      <button class="quick-filter-btn" id="fBtnLastWeek" onclick="window.setFinQuickRange('lastWeek')">지난 주</button>
      <button class="quick-filter-btn" id="fBtnThisMonth" onclick="window.setFinQuickRange('thisMonth')">이번 달</button>
      <button class="quick-filter-btn active" id="fBtnAll" onclick="window.setFinQuickRange('all')">전체</button>
    </div>
    <div class="row g-2 align-items-center">
      <div class="col-5">
        <input type="date" id="finStartDate" class="form-control input-custom-finance" onchange="window.fetchFinanceLogs()">
      </div>
      <div class="col-2 text-center text-secondary small">~</div>
      <div class="col-5">
        <input type="date" id="finEndDate" class="form-control input-custom-finance" onchange="window.fetchFinanceLogs()">
      </div>
    </div>
  </div>

  <!-- 입출금 내역 목록 -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-secondary small fw-bold">금고 입출금 상세 내역</span>
    <span class="text-secondary" style="font-size: 0.72rem;">총 <strong id="finTxCount" class="text-info">0</strong>건</span>
  </div>
  <div id="finTxListContainer" style="max-height: 380px; overflow-y: auto;">
    <div class="text-secondary small text-center py-3">내역을 조회 중...</div>
  </div>
</div>

<!-- 입출금 등록 모달 -->
<div id="financeTxModal" class="tx-modal-bg" style="display: none;">
  <div class="tx-modal-box">
    <div class="p-3 border-bottom border-secondary border-opacity-25 d-flex justify-content-between align-items-center" style="background: #090e1c;">
      <h6 class="fw-bold mb-0 text-white" id="modalTxTitle">금고 입출금 등록</h6>
      <button type="button" class="btn-close btn-close-white" style="font-size: 0.8rem;" onclick="window.closeTxModal()"></button>
    </div>
    <div class="p-3">
      <!-- 🎯 지정 날짜 입력 -->
      <div class="mb-2">
        <label class="form-label text-secondary mb-1" style="font-size: 0.75rem;">기준 일자 (과거 날짜 선택 가능):</label>
        <input type="date" id="modalTxDate" class="form-control input-custom-finance">
      </div>
      <div class="mb-2">
        <label class="form-label text-secondary mb-1" style="font-size: 0.75rem;">금액 (다이아):</label>
        <input type="text" id="modalTxAmount" class="form-control input-custom-finance" placeholder="숫자만 입력" onkeyup="window.formatCommaTx(this)">
      </div>
      <div class="mb-2">
        <label class="form-label text-secondary mb-1" style="font-size: 0.75rem;">구분 / 카테고리:</label>
        <select id="modalTxCategory" class="form-control input-custom-finance">
          <option value="길드수익">길드수익 (보스/아이템 판매)</option>
          <option value="길드자금분배">길드자금분배</option>
          <option value="운영비">운영비 (용병/이벤트 지원)</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary mb-1" style="font-size: 0.75rem;">상세 내용 / 사유:</label>
        <input type="text" id="modalTxReason" class="form-control input-custom-finance" placeholder="예: 10/11 주간 보스 판매금 입금">
      </div>
      <button type="button" class="btn btn-primary btn-sm w-100 fw-bold py-2" id="btnSubmitTx" onclick="window.submitTxRecord()">
        등록 완료
      </button>
    </div>
  </div>
</div>

<script>
  window.currentTxType = '입금';

  window.formatCommaTx = function(elem) {
    const val = elem.value.replace(/[^0-9]/g, '');
    elem.value = val ? Number(val).toLocaleString() : '';
  };

  window.openTxModal = function(type) {
    window.currentTxType = type;
    document.getElementById('modalTxTitle').innerText = `금고 [${type}] 등록`;
    document.getElementById('modalTxAmount').value = '';
    document.getElementById('modalTxReason').value = '';
    
    // 오늘 날짜를 기본값으로 세팅 (과거 날짜 변경 가능)
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('modalTxDate').value = `${yyyy}-${mm}-${dd}`;

    const catSelect = document.getElementById('modalTxCategory');
    if (type === '입금') {
      catSelect.value = '길드수익';
    } else {
      catSelect.value = '운영비';
    }

    document.getElementById('financeTxModal').style.display = 'flex';
  };

  window.closeTxModal = function() {
    document.getElementById('financeTxModal').style.display = 'none';
  };

  // 🎯 날짜를 지정하여 DB에 기록
  window.submitTxRecord = async function() {
    const rawAmt = document.getElementById('modalTxAmount').value.replace(/[^0-9]/g, '');
    const reason = document.getElementById('modalTxReason').value.trim();
    const category = document.getElementById('modalTxCategory').value;
    const selectedDate = document.getElementById('modalTxDate').value;

    if (!rawAmt || parseInt(rawAmt, 10) <= 0) {
      return alert("금액을 1 다이아 이상 입력해주세요.");
    }
    if (!selectedDate) {
      return alert("기준 일자를 선택해주세요.");
    }

    // 선택된 날짜에 정오(12:00:00) 타임스탬프를 부여하여 created_at에 명시적 저장
    const customCreatedAt = new Date(`${selectedDate}T12:00:00`).toISOString();

    const btn = document.getElementById('btnSubmitTx');
    btn.disabled = true;
    btn.innerText = '저장 중...';

    try {
      await apiRequest("guild_finances", "POST", [{
        tx_type: window.currentTxType,
        type: window.currentTxType,
        category: category,
        amount: parseInt(rawAmt, 10),
        reason: reason || `${selectedDate} ${window.currentTxType}`,
        created_at: customCreatedAt
      }]);

      window.closeTxModal();
      await window.fetchFinanceLogs();
    } catch (err) {
      alert("등록 실패: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '등록 완료';
    }
  };

  window.setFinQuickRange = function(type) {
    document.querySelectorAll('#fBtnThisWeek, #fBtnLastWeek, #fBtnThisMonth, #fBtnAll').forEach(b => b.classList.remove('active'));
    const today = new Date();
    const currentDay = (today.getDay() + 6) % 7;
    let start = null, end = null;

    if (type === 'thisWeek') {
      document.getElementById('fBtnThisWeek').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - currentDay);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    } else if (type === 'lastWeek') {
      document.getElementById('fBtnLastWeek').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - currentDay - 7);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    } else if (type === 'thisMonth') {
      document.getElementById('fBtnThisMonth').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (type === 'all') {
      document.getElementById('fBtnAll').classList.add('active');
    }

    const fmt = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
    document.getElementById('finStartDate').value = fmt(start);
    document.getElementById('finEndDate').value = fmt(end);
    window.fetchFinanceLogs();
  };

  window.fetchFinanceLogs = async function() {
    const s = document.getElementById('finStartDate').value;
    const e = document.getElementById('finEndDate').value;
    const container = document.getElementById('finTxListContainer');
    container.innerHTML = '<div class="text-secondary small text-center py-3"><span class="spinner-border spinner-border-sm text-info me-1"></span>조회 중...</div>';

    try {
      const logs = await apiRequest("guild_finances?select=*&order=created_at.desc,id.desc");
      let totalBal = 0, totalIn = 0, totalOut = 0;
      let filtered = [];

      (logs || []).forEach(l => {
        const t = (l.tx_type || l.type || '');
        const amt = Number(l.amount) || 0;
        if (t === '입금') totalBal += amt;
        else if (t === '출금') totalBal -= amt;

        const d = (l.created_at || '').slice(0, 10);
        if (s && d < s) return;
        if (e && d > e) return;

        if (t === '입금') totalIn += amt;
        else if (t === '출금') totalOut += amt;
        filtered.push(l);
      });

      document.getElementById('finVaultBalance').innerText = totalBal.toLocaleString();
      document.getElementById('finTotalIn').innerText = totalIn.toLocaleString();
      document.getElementById('finTotalOut').innerText = totalOut.toLocaleString();
      document.getElementById('finTxCount').innerText = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-secondary small text-center py-3">내역이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(l => {
        const isDeposit = (l.tx_type || l.type) === '입금';
        const dateStr = (l.created_at || '').slice(0, 10);
        const amtStr = Number(l.amount || 0).toLocaleString();

        return `
          <div class="tx-item-card">
            <div>
              <div class="d-flex align-items-center gap-1 mb-1">
                <span class="badge ${isDeposit ? 'bg-success' : 'bg-danger'}" style="font-size:0.68rem;">${isDeposit ? '입금' : '출금'}</span>
                <span class="fw-bold text-white small ms-1">${l.reason || l.category || '금고 입출금'}</span>
              </div>
              <div class="text-secondary" style="font-size: 0.72rem;">
                카테고리: ${l.category || '-'} • 일시: ${dateStr}
              </div>
            </div>
            <div class="text-end">
              <strong class="${isDeposit ? 'text-success' : 'text-danger'} fs-6">${isDeposit ? '+' : '-'}${amtStr} D</strong>
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="text-danger small text-center py-3">조회 실패: ${err.message}</div>`;
    }
  };

  (function initFin() {
    window.setFinQuickRange('all');
  })();
</script>
