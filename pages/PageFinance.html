<style>
  .finance-card-main {
    background: rgba(18, 26, 45, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);

    padding: 16px;

  }

  .finance-balance-banner {
    background: linear-gradient(135deg, #0d172a 0%, #172554 100%);
    border: 1.5px solid rgba(56, 189, 248, 0.3);

    padding: 18px 16px;
    text-align: center;
    margin-bottom: 14px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);

  .finance-section-box {
    background: #080d1a;
    border: 1px solid #1e2c47;

    padding: 14px;
    margin-bottom: 12px;
  }

  .btn-period-pill {

    border: 1px solid #233554;
    color: #94a3b8;

    font-weight: 700;

    border-radius: 8px;

  }
  .btn-period-pill:hover { border-color: #38bdf8; color: #fff; }
  .btn-period-pill.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
    font-weight: 800;
  }

  /* 입력창 슬림 보더 및 placeholder 가독성 향상 */
  .input-custom-fin {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    padding: 8px 12px !important;
    font-size: 0.85rem !important;
    color-scheme: dark;

  }
  .input-custom-fin:focus, .input-custom-fin:hover {
    border-color: #38bdf8 !important;

    outline: none !important;
  }
  .input-custom-fin::placeholder {

  .btn-fin-main-mode {

    border: 1px solid #1e2c47;

    border-radius: 10px;

  }

  .btn-fin-main-mode.active-out {
    background: rgba(239, 68, 68, 0.18);

  }

  .btn-fin-sub-tab {
    flex: 1;
    background: #0d1527;
    border: 1px solid #1e2c47;
    color: #94a3b8;

    border-radius: 8px;

  }
  .btn-fin-sub-tab.active {
    background: rgba(14, 165, 233, 0.2);

    color: #38bdf8;
    font-weight: 800;
  }

  /* 주변 스타일에 맞춘 차분한 실선 프리뷰 박스 */
  .diff-calc-box {
    background: #090e1c;

  .finance-history-item {

  /* 헤더 우측 유틸 버튼 */

  /* 지급 계산기 모달 */

  <!-- 금고 입출금 상세 내역 -->

    </div>

<!-- 플로팅 토스트 -->
<div id="finToastBox" class="custom-fin-toast">

</div>

<!-- 🎯 [기존 분배/지급 계산기 모달 복원] -->
<div id="payCalcModal" class="calc-modal-backdrop" style="display: none;">
  <div class="calc-modal-box">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="fw-bold text-white small d-flex align-items-center gap-1">
        <span>🧮</span>
        <span>길드 분배 & 지급 계산기</span>
      </div>
      <button type="button" class="btn-close btn-close-white" style="font-size: 0.75rem;" onclick="window.closePayCalcModal()"></button>
    </div>

    <div class="row g-2 mb-2">
      <div class="col-7">
        <label class="form-label small text-secondary mb-1">분배 총 다이아</label>
        <input type="number" id="calcModalTotalDia" class="form-control input-custom-fin" placeholder="예: 50000" onkeyup="window.calcPayModalShare()">
      </div>
      <div class="col-5">
        <label class="form-label small text-secondary mb-1">참여 인원</label>
        <input type="number" id="calcModalMemberCnt" class="form-control input-custom-fin" placeholder="예: 15" onkeyup="window.calcPayModalShare()">
      </div>
    </div>

    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label small text-secondary mb-1">🏛️ 길드비 적립 비율</label>
        <select id="calcModalFeeRate" class="form-select input-custom-fin" onchange="window.calcPayModalShare()">
          <option value="10">10% 적립</option>
          <option value="5">5% 적립</option>
          <option value="15">15% 적립</option>
          <option value="0" selected>0% (전액 분배)</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label small text-secondary mb-1">➕ 길드 추가 지원금</label>
        <input type="number" id="calcModalExtraFund" class="form-control input-custom-fin" placeholder="선택 (예: 2000)" onkeyup="window.calcPayModalShare()">
      </div>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="calcModalTaxToggle" checked onchange="window.calcPayModalShare()">
      <label class="form-check-label small text-secondary" for="calcModalTaxToggle">게임 경매 수수료 5% 차감 적용</label>
    </div>

    <div class="p-2 rounded mb-3" style="background:#080d1a; border:1px solid #1e2c47; font-size:0.76rem; line-height:1.7;">
      <div class="d-flex justify-content-between text-secondary">
        <span>경매 수수료 (5%):</span>
        <strong class="text-danger" id="calcModalTaxText">-0 D</strong>
      </div>
      <div class="d-flex justify-content-between text-secondary">
        <span>길드비 적립액:</span>
        <strong class="text-warning" id="calcModalFeeText">0 D</strong>
      </div>
      <div class="d-flex justify-content-between text-secondary">
        <span>실제 총 분배 풀:</span>
        <strong class="text-white" id="calcModalPoolText">0 D</strong>
      </div>
      <div class="d-flex justify-content-between text-secondary pt-1 border-top border-secondary border-opacity-25 mt-1">
        <span class="text-info fw-bold">👉 1인당 배당금:</span>
        <strong class="text-info fs-6" id="calcModalPerShareText">0 다이아</strong>
      </div>
      <div class="d-flex justify-content-between text-secondary">
        <span>배분 후 잔여 다이아:</span>
        <strong class="text-warning" id="calcModalRemainderText">0 다이아</strong>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-warning btn-sm flex-fill fw-bold py-2" onclick="window.copyCalcModalResult()">
        <i class="fa-solid fa-share-nodes me-1"></i>계산결과 복사
      </button>
      <button type="button" class="btn btn-secondary btn-sm flex-fill fw-bold py-2" style="background:#1e293b; border-color:#334155;" onclick="window.closePayCalcModal()">
        닫기
      </button>
    </div>

<script>
  window.currentFinMainMode = 'deposit';
  window.currentDepositMethod = 'total';
  window.currentDbVaultBalance = 0;
  window.finHistoryData = [];
  window.finToastTimer = null;
  window.activeGuildName = "ECLIPSE"; // 기본값 (설정값 로드 후 덮어씌움)

  window.showFinToast = function(msg, icon = "✅") {
    const toast = document.getElementById("finToastBox");
    const m = document.getElementById("finToastMsg");
    const ic = document.getElementById("finToastIcon");
    if (!toast) return;

    m.innerText = msg;
    ic.innerText = icon;
    toast.classList.add("show");

    if (window.finToastTimer) clearTimeout(window.finToastTimer);
    window.finToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  // 🎯 설정창에 등록된 실제 길드명 불러오기
  async function loadConfiguredGuildName() {
    try {
      // 1. 세션 캐시 확인
      const cached = sessionStorage.getItem("guild_name");
      if (cached) {
        window.activeGuildName = cached;
        return;
      }
      // 2. DB guild_settings 조회
      const res = await apiRequest("guild_settings?key=eq.guild_name");
      if (res && res.length > 0 && res[0].value) {
        window.activeGuildName = res[0].value;
        sessionStorage.setItem("guild_name", res[0].value);
      }
    } catch (e) {
      window.activeGuildName = "ECLIPSE";
    }
  }

  // 🎯 지급 계산기 모달 컨트롤
  window.openPayCalcModal = function() {
    document.getElementById("calcModalTotalDia").value = '';
    document.getElementById("calcModalMemberCnt").value = '';
    document.getElementById("calcModalExtraFund").value = '';
    document.getElementById("calcModalTaxText").innerText = '-0 D';
    document.getElementById("calcModalFeeText").innerText = '0 D';
    document.getElementById("calcModalPoolText").innerText = '0 D';
    document.getElementById("calcModalPerShareText").innerText = '0 다이아';
    document.getElementById("calcModalRemainderText").innerText = '0 다이아';
    document.getElementById("payCalcModal").style.display = 'flex';
  };

  window.closePayCalcModal = function() {
    document.getElementById("payCalcModal").style.display = 'none';
  };

  window.calcPayModalShare = function() {
    const totalDia = parseInt(document.getElementById("calcModalTotalDia").value) || 0;
    const count = parseInt(document.getElementById("calcModalMemberCnt").value) || 0;
    const feeRate = parseInt(document.getElementById("calcModalFeeRate").value) || 0;
    const extraFund = parseInt(document.getElementById("calcModalExtraFund").value) || 0;
    const isTax = document.getElementById("calcModalTaxToggle").checked;

    if (totalDia > 0 && count > 0) {
      const tax = isTax ? Math.floor(totalDia * 0.05) : 0;
      const netAfterTax = totalDia - tax;
      const fee = Math.floor(netAfterTax * (feeRate / 100));
      const pool = (netAfterTax - fee) + extraFund;
      const perShare = Math.floor(pool / count);
      const remainder = pool - (perShare * count);

      document.getElementById("calcModalTaxText").innerText = isTax ? `-${tax.toLocaleString()} D (5%)` : '0 D (미적용)';
      document.getElementById("calcModalFeeText").innerText = `${fee.toLocaleString()} D (${feeRate}%)`;
      document.getElementById("calcModalPoolText").innerText = `${pool.toLocaleString()} D`;
      document.getElementById("calcModalPerShareText").innerText = `${perShare.toLocaleString()} 다이아`;
      document.getElementById("calcModalRemainderText").innerText = `${remainder.toLocaleString()} 다이아`;
    } else {
      document.getElementById("calcModalTaxText").innerText = '-0 D';
      document.getElementById("calcModalFeeText").innerText = '0 D';
      document.getElementById("calcModalPoolText").innerText = '0 D';
      document.getElementById("calcModalPerShareText").innerText = '0 다이아';
      document.getElementById("calcModalRemainderText").innerText = '0 다이아';
    }
  };

  window.copyCalcModalResult = function() {
    const totalDia = parseInt(document.getElementById("calcModalTotalDia").value) || 0;
    const count = parseInt(document.getElementById("calcModalMemberCnt").value) || 0;
    const perShare = document.getElementById("calcModalPerShareText").innerText;
    const remainder = document.getElementById("calcModalRemainderText").innerText;
    const pool = document.getElementById("calcModalPoolText").innerText;

    if (!totalDia || !count) {
      return window.showFinToast("금액과 인원수를 먼저 입력해주세요.", "⚠️");
    }

    const gName = window.activeGuildName || "길드";
    const text = `[🧮 ${gName} 자금 분배 계산 결과]\n` +
      `• 분배 총 다이아: ${totalDia.toLocaleString()} D\n` +
      `• 분배 인원: ${count}명\n` +
      `• 실제 분배 풀: ${pool}\n` +
      `• 1인당 배당금: ${perShare}\n` +
      `• 배분 후 잔여: ${remainder}\n` +
      `────────────────\n` +
      `※ 자동 분배 계산기 산출 내역입니다.`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
      window.showFinToast("계산 결과가 복사되었습니다!", "📋");
    }
  };

  function setTodayDateInput() {
    const d = new Date();
    const pad = n => (n < 10 ? '0' + n : n);
    const ymd = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const dateInput = document.getElementById("finTxDate");
    if (dateInput && !dateInput.value) {
      dateInput.value = ymd;
    }
  }

  window.switchFinMainMode = function(mode) {
    window.currentFinMainMode = mode;
    const btnIn = document.getElementById('modeBtnDeposit');
    const btnOut = document.getElementById('modeBtnWithdraw');
    const subTabs = document.getElementById('depositSubTabs');
    const diffBox = document.getElementById('diffCalcBox');
    const amountLabel = document.getElementById('finAmountLabel');
    const amountInput = document.getElementById('finAmountInput');
    const dateLabel = document.getElementById('finDateLabel');
    const submitBtn = document.getElementById('btnSubmitFinAction');

    if (mode === 'deposit') {
      btnIn.className = 'btn-fin-main-mode active-in';
      btnOut.className = 'btn-fin-main-mode';
      subTabs.style.display = 'flex';
      dateLabel.innerText = '입금 일자';
      window.switchDepositMethod(window.currentDepositMethod);
      submitBtn.className = 'btn btn-outline-success btn-sm w-100 fw-bold py-2';
      submitBtn.innerHTML = '<i class="fa-solid fa-plus me-1"></i> 금고에 수익 입금 처리';
    } else {
      btnIn.className = 'btn-fin-main-mode';
      btnOut.className = 'btn-fin-main-mode active-out';
      subTabs.style.display = 'none';
      diffBox.style.display = 'none';
      dateLabel.innerText = '지출 일자';
      amountLabel.innerText = '지출 금액 (다이아)';
      amountInput.placeholder = '지출할 금액 입력';
      submitBtn.className = 'btn btn-outline-danger btn-sm w-100 fw-bold py-2';
      submitBtn.innerHTML = '<i class="fa-solid fa-minus me-1"></i> 금고에서 지출 처리';
    }
    window.calcNetDiffAmount();
  };

  window.switchDepositMethod = function(method) {
    window.currentDepositMethod = method;
    const tabTotal = document.getElementById('subTabTotal');
    const tabDirect = document.getElementById('subTabDirect');
    const diffBox = document.getElementById('diffCalcBox');
    const amountLabel = document.getElementById('finAmountLabel');
    const amountInput = document.getElementById('finAmountInput');

    if (method === 'total') {
      tabTotal.className = 'btn-fin-sub-tab active';
      tabDirect.className = 'btn-fin-sub-tab';
      amountLabel.innerText = '금고 총 보유액 (다이아)';
      amountInput.placeholder = '금고 총액 입력';
      diffBox.style.display = 'block';
    } else {
      tabTotal.className = 'btn-fin-sub-tab';
      tabDirect.className = 'btn-fin-sub-tab active';
      amountLabel.innerText = '추가 입금액 (다이아)';
      amountInput.placeholder = '추가할 입금액 입력';
      diffBox.style.display = 'none';
    }
    window.calcNetDiffAmount();
  };

  // 🎯 차액 계산 (음수 방지 및 기본 0 다이아 표시)
  window.calcNetDiffAmount = function() {
    const prevBal = window.currentDbVaultBalance || 0;
    const inputVal = parseInt(document.getElementById('finAmountInput').value) || 0;

    document.getElementById('calcPrevBalanceText').innerText = `${prevBal.toLocaleString()} D`;
    document.getElementById('calcInputTotalText').innerText = `${inputVal.toLocaleString()} D`;

    if (window.currentFinMainMode === 'deposit' && window.currentDepositMethod === 'total') {
      if (inputVal <= prevBal) {
        document.getElementById('calcDiffResultText').className = 'text-warning fs-6';
        document.getElementById('calcDiffResultText').innerText = '+0 다이아';
      } else {
        const diff = inputVal - prevBal;
        document.getElementById('calcDiffResultText').className = 'text-warning fs-6';
        document.getElementById('calcDiffResultText').innerText = `+${diff.toLocaleString()} 다이아`;
      }
    }
  };

  window.setFinFilterPeriod = function(type, elem) {
    document.querySelectorAll(".btn-period-pill").forEach(p => p.classList.remove("active"));
    if (elem) elem.classList.add("active");

    const startInput = document.getElementById("finStartDate");
    const endInput = document.getElementById("finEndDate");
    const now = new Date();
    const pad = n => (n < 10 ? '0' + n : n);
    const toYmd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    if (type === "all") {
      startInput.value = "";
      endInput.value = "";
    } else if (type === "thisWeek") {
      const day = now.getDay() || 7;
      const mon = new Date(now);
      mon.setDate(now.getDate() - day + 1);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      startInput.value = toYmd(mon);
      endInput.value = toYmd(sun);
    } else if (type === "lastWeek") {
      const day = now.getDay() || 7;
      const lastMon = new Date(now);
      lastMon.setDate(now.getDate() - day - 6);
      const lastSun = new Date(lastMon);
      lastSun.setDate(lastMon.getDate() + 6);
      startInput.value = toYmd(lastMon);
      endInput.value = toYmd(lastSun);
    } else if (type === "thisMonth") {
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      startInput.value = toYmd(first);
      endInput.value = toYmd(last);
    }

    window.loadFinanceLogs();
  };

  // 🎯 guild_finances 데이터 로드
  window.loadFinanceLogs = async function() {
    const container = document.getElementById("financeHistoryContainer");
    if (container) {
      container.innerHTML = '<div class="text-secondary small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>내역을 불러오는 중...</div>';
    }

    const startVal = document.getElementById("finStartDate").value;
    const endVal = document.getElementById("finEndDate").value;

    try {
      const logs = await apiRequest("guild_finances?select=*&order=id.desc");
      window.finHistoryData = logs || [];

      let totalDeposit = 0;
      let totalWithdraw = 0;

      window.finHistoryData.forEach(item => {
        const amt = Number(item.amount) || 0;
        const type = (item.tx_type || item.type || '');
        if (type === '입금') {
          totalDeposit += amt;
        } else if (type === '출금') {
          totalWithdraw += amt;
        }
      });

      window.currentDbVaultBalance = totalDeposit - totalWithdraw;
      document.getElementById("vaultTotalBalanceText").innerText = `${window.currentDbVaultBalance.toLocaleString()} 다이아`;
      document.getElementById("vaultTotalDepositText").innerText = `+${totalDeposit.toLocaleString()}`;
      document.getElementById("vaultTotalWithdrawText").innerText = `-${totalWithdraw.toLocaleString()}`;

      window.calcNetDiffAmount();

      let filtered = window.finHistoryData;
      if (startVal || endVal) {
        filtered = filtered.filter(item => {
          const itemDate = (item.created_at || '').slice(0, 10);
          if (startVal && itemDate < startVal) return false;
          if (endVal && itemDate > endVal) return false;
          return true;
        });
      }

      let pIn = 0, pOut = 0;
      filtered.forEach(it => {
        const amt = Number(it.amount) || 0;
        const type = (it.tx_type || it.type || '');
        if (type === '입금') pIn += amt;
        else if (type === '출금') pOut += amt;
      });
      document.getElementById("periodNetProfitText").innerText = `${(pIn - pOut).toLocaleString()} 다이아`;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-secondary small text-center py-3">해당 기간의 금고 내역이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const type = (item.tx_type || item.type || '입금');
        const isDep = (type === '입금');
        const amt = Number(item.amount) || 0;
        const badgeClass = isDep ? 'bg-success bg-opacity-25 text-success' : 'bg-danger bg-opacity-25 text-danger';
        const sign = isDep ? '+' : '-';
        const reason = item.reason || item.memo || item.description || '-';
        const dateStr = (item.created_at || '').slice(0, 10);

        return `
          <div class="finance-history-item">
            <div style="min-width: 0; flex: 1;">
              <div class="fw-bold text-white small text-truncate d-flex align-items-center gap-1">
                <span class="badge ${badgeClass}" style="font-size: 0.65rem;">${type} • ${item.category || '기타'}</span>
                <span class="text-truncate">${reason}</span>
              </div>
              <div class="text-secondary mt-1" style="font-size: 0.7rem;">${dateStr}</div>
            </div>
            <div class="text-end" style="white-space: nowrap; margin-left: 10px;">
              <span class="fw-bold ${isDep ? 'text-success' : 'text-danger'}" style="font-size: 0.9rem;">
                ${sign}${amt.toLocaleString()} D
              </span>
            </div>
          </div>
        `;
      }).join('');

    } catch (err) {
      if (container) {
        container.innerHTML = `<div class="text-danger small text-center py-3">조회 실패: ${err.message}</div>`;
      }
    }
  };

  // 🎯 금고 반영 처리
  window.submitFinanceRecord = async function() {
    const isSuper = (sessionStorage.getItem("admin_role") === "super");
    if (!isSuper) {
      return window.showFinToast("금고 입출금 등록은 관리자 권한이 필요합니다.", "⚠️");
    }

    const inputVal = parseInt(document.getElementById("finAmountInput").value) || 0;
    const reasonText = (document.getElementById("finReasonInput").value || "").trim();
    const memoText = (document.getElementById("finMemoInput").value || "").trim();

    let finalAmount = 0;
    let typeStr = '';
    let category = '';

    if (window.currentFinMainMode === 'deposit') {
      typeStr = '입금';
      category = '수익금입금';

      if (window.currentDepositMethod === 'total') {
        finalAmount = inputVal - window.currentDbVaultBalance;
        if (finalAmount <= 0) {
          return window.showFinToast("입력 총액이 직전 잔액보다 커야 입금할 차액이 발생합니다.", "⚠️");
        }
      } else {
        finalAmount = inputVal;
        if (finalAmount <= 0) {
          return window.showFinToast("입금할 금액을 입력해주세요.", "⚠️");
        }
      }
    } else {
      typeStr = '출금';
      category = '길드지출';
      finalAmount = inputVal;
      if (finalAmount <= 0) {
        return window.showFinToast("지출할 금액을 입력해주세요.", "⚠️");
      }
    }

    let fullReason = reasonText || (typeStr === '입금' ? '길드 수익금 입금' : '길드 운영비 지출');
    if (memoText) {
      fullReason += ` (${memoText})`;
    }

    const submitBtn = document.getElementById("btnSubmitFinAction");
    submitBtn.disabled = true;

    try {
      await apiRequest("guild_finances", "POST", [{
        tx_type: typeStr,
        category: category,
        amount: finalAmount,
        reason: fullReason
      }]);

      window.showFinToast(`${typeStr} ${finalAmount.toLocaleString()} 다이아가 금고에 반영되었습니다!`, "🎉");
      document.getElementById("finAmountInput").value = '';
      document.getElementById("finReasonInput").value = '';
      document.getElementById("finMemoInput").value = '';

      submitBtn.disabled = false;
      await window.loadFinanceLogs();
    } catch (err) {
      submitBtn.disabled = false;
      window.showFinToast("반영 실패: " + err.message, "❌");
    }
  };

  // 🎯 카톡 복사 (설정된 길드명 연동)
  window.copyFinancesToKakao = function() {
    const balance = document.getElementById("vaultTotalBalanceText").innerText;
    const dep = document.getElementById("vaultTotalDepositText").innerText;
    const wth = document.getElementById("vaultTotalWithdrawText").innerText;
    const netProfit = document.getElementById("periodNetProfitText").innerText;
    const gName = window.activeGuildName || "길드";

    let text = `[🏛️ ${gName} 길드 금고 및 비용 현황]\n` +
      `• 현재 금고 잔액: ${balance}\n` +
      `• 누적 적립액: ${dep} 다이아\n` +
      `• 누적 지출액: ${wth} 다이아\n` +
      `• 지정 기간 수익: ${netProfit}\n` +
      `────────────────\n` +
      `※ 정산 및 분배 내역이 실시간 반영된 결과입니다.`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
      window.showFinToast("금고 현황이 복사되었습니다!", "📋");
    }
  };

  // 🎯 초기 실행: 길드명 로드, 날짜 설정 및 '이번 주' 기본 로드
  (async function initFinanceModule() {
    await loadConfiguredGuildName();
    setTodayDateInput();
    const pill = document.getElementById("pillThisWeek");
    window.setFinFilterPeriod('thisWeek', pill);
  })();
</script>
