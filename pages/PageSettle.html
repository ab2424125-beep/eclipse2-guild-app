<!-- ==========================================
     [ECLIPSE 길드관리] 길드 정산 및 자금 배분 모듈
     경로: pages/PageSettle.html
     ========================================== -->
<style>
  .settle-card-main {
    background: rgba(18, 26, 45, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .settle-filter-box {
    background: #080d1a;
    border: 1px solid #1e2c47;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .btn-period-pill {
    background: #111a2e;
    border: 1px solid #233554;
    color: #94a3b8;
    font-size: 0.74rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-period-pill:hover { border-color: #38bdf8; color: #fff; }
  .btn-period-pill.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
    font-weight: 800;
  }

  .date-range-input {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 8px !important;
    font-size: 0.78rem !important;
    padding: 6px 10px !important;
    color-scheme: dark;
  }

  .btn-calc-aggregate {
    background: transparent;
    border: 1.5px solid #0ea5e9;
    color: #38bdf8;
    font-weight: 800;
    font-size: 0.82rem;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-calc-aggregate:hover {
    background: rgba(14, 165, 233, 0.15);
    color: #ffffff;
  }

  .summary-stat-dashboard {
    background: #0d1527;
    border: 1px solid #1e2c47;
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .stat-label-sub { font-size: 0.72rem; color: #94a3b8; }
  .stat-val-highlight { font-size: 1.25rem; font-weight: 800; }

  .tab-switch-group {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .btn-tab-switch {
    flex: 1;
    background: #0d1527;
    border: 1px solid #1e2c47;
    color: #94a3b8;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 9px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .btn-tab-switch.active {
    background: #0284c7;
    border-color: #38bdf8;
    color: #ffffff;
    font-weight: 800;
  }

  .input-search-settle {
    background: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    font-size: 0.82rem !important;
    padding: 8px 12px !important;
  }

  .member-settle-card {
    background: #090e1c;
    border: 1px solid #1b263b;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .member-settle-card:hover {
    border-color: #38bdf8;
    background: #0f172a;
  }

  .btn-copy-kakaotalk {
    background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
    border: none;
    color: #ffffff;
    font-size: 0.92rem;
    font-weight: 800;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-copy-kakaotalk:hover { opacity: 0.95; transform: translateY(-1px); }

  .custom-settle-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #0d1830;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    color: #ffffff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.88rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
  }
  .custom-settle-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 길드원 상세 내역 모달 */
  .settle-modal-backdrop {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(6, 10, 20, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999999;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .settle-modal-box {
    background: #0d1527;
    border: 1.5px solid #38bdf8;
    border-radius: 20px;
    width: 100%; max-width: 360px;
    padding: 20px 16px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9);
    text-align: left;
  }
</style>

<div class="settle-card-main mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.3rem;">💰</span>
      <h6 class="fw-bold mb-0 text-white">길드 정산 및 자금 배분</h6>
    </div>
  </div>

  <!-- 기간 필터 -->
  <div class="settle-filter-box">
    <div class="d-flex gap-1 mb-2">
      <button type="button" class="btn-period-pill" onclick="window.setSettleFilterPeriod('thisWeek', this)">이번 주</button>
      <button type="button" class="btn-period-pill" onclick="window.setSettleFilterPeriod('lastWeek', this)">지난 주</button>
      <button type="button" class="btn-period-pill" onclick="window.setSettleFilterPeriod('thisMonth', this)">이번 달</button>
      <button type="button" class="btn-period-pill active" onclick="window.setSettleFilterPeriod('all', this)">전체</button>
    </div>

    <div class="row g-2 align-items-center mb-2">
      <div class="col-5">
        <input type="date" id="settleStartDate" class="form-control date-range-input" onchange="window.resetPeriodPillActive()">
      </div>
      <div class="col-2 text-center text-secondary small">~</div>
      <div class="col-5">
        <input type="date" id="settleEndDate" class="form-control date-range-input" onchange="window.resetPeriodPillActive()">
      </div>
    </div>

    <button type="button" class="btn btn-calc-aggregate w-100" onclick="window.calculateSettlementData()">
      <i class="fa-solid fa-calculator me-1"></i> 정산 데이터 집계
    </button>
  </div>

  <!-- 집계 요약 대시보드 -->
  <div class="summary-stat-dashboard">
    <div>
      <div class="stat-label-sub">기간 총 분배 풀</div>
      <div class="stat-val-highlight text-warning" id="totalDistPoolText">0 다이아</div>
    </div>
    <div class="text-end">
      <div class="stat-label-sub">정산 수령 인원</div>
      <div class="stat-val-highlight text-info" id="totalMemberCountText">0 명</div>
    </div>
  </div>

  <!-- 탭 전환 -->
  <div class="tab-switch-group">
    <button type="button" class="btn-tab-switch active" id="tabBtnMembers" onclick="window.switchSettleTab('members')">
      <i class="fa-solid fa-users me-1"></i> 길드원별 수령액
    </button>
    <button type="button" class="btn-tab-switch" id="tabBtnLogs" onclick="window.switchSettleTab('logs')">
      <i class="fa-solid fa-list-check me-1"></i> 전체 정산 상세 로그
    </button>
  </div>

  <!-- 1. 길드원별 수령액 뷰 -->
  <div id="settleMembersView">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small text-secondary" style="font-size: 0.74rem;">
        길드원별 최종 합산 수령액 <span class="text-info">(활동 점수 순위순 / 클릭 시 상세 내역)</span>
      </span>
    </div>

    <div class="input-group mb-2">
      <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-color: #233554 !important;">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>
      <input type="text" id="searchSettleMember" class="form-control input-search-settle" placeholder="길드원 닉네임 검색..." onkeyup="window.renderMemberListOnly()">
    </div>

    <div id="settleMemberListContainer" style="max-height: 320px; overflow-y: auto;">
      <div class="text-secondary small text-center py-4">데이터를 집계하는 중...</div>
    </div>
  </div>

  <!-- 2. 전체 로그 뷰 -->
  <div id="settleLogsView" style="display: none;">
    <div id="settleLogListContainer" style="max-height: 350px; overflow-y: auto;">
      <div class="text-secondary small text-center py-4">정산 내역을 불러오는 중...</div>
    </div>
  </div>

  <!-- 카카오톡 공유 버튼 -->
  <button type="button" class="btn btn-copy-kakaotalk w-100 mt-3" onclick="window.copySettleToKakao()">
    <i class="fa-solid fa-share-nodes me-1"></i> 정산 결과 카톡 공유 복사
  </button>
</div>

<!-- 플로팅 토스트 -->
<div id="settleToastBox" class="custom-settle-toast">
  <span id="settleToastIcon">✅</span>
  <span id="settleToastMsg">알림</span>
</div>

<!-- 길드원 상세 내역 모달 -->
<div id="memberDetailModal" class="settle-modal-backdrop" style="display: none;">
  <div class="settle-modal-box">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold text-white m-0" id="detailMemberNameTitle">길드원 상세</h6>
      <button type="button" class="btn-close btn-close-white" style="font-size: 0.75rem;" onclick="window.closeMemberDetailModal()"></button>
    </div>
    <div class="p-2 rounded mb-2" style="background:#080d1a; border:1px solid #1e2c47;">
      <div class="d-flex justify-content-between small text-secondary">
        <span>총 수령 합계:</span>
        <strong class="text-warning fs-6" id="detailMemberTotalText">0 다이아</strong>
      </div>
      <div class="d-flex justify-content-between small text-secondary mt-1">
        <span>참여 분배 건수:</span>
        <strong class="text-info" id="detailMemberCountText">0 건</strong>
      </div>
    </div>
    <div class="small fw-bold text-secondary mb-1">상세 분배 이력</div>
    <div id="detailMemberHistoryList" style="max-height: 220px; overflow-y: auto;"></div>
    <button type="button" class="btn btn-secondary btn-sm w-100 mt-3 py-2 fw-bold" style="background: #1e293b; border-color: #334155;" onclick="window.closeMemberDetailModal()">
      닫기
    </button>
  </div>
</div>

<script>
  window.settleRawDistributions = [];
  window.settleMemberMap = {};
  window.settleMemberActivityPoints = {};
  window.currentSettleTab = "members";
  window.settleToastTimer = null;

  window.showSettleToast = function(msg, icon = "✅") {
    const toast = document.getElementById("settleToastBox");
    const m = document.getElementById("settleToastMsg");
    const ic = document.getElementById("settleToastIcon");
    if (!toast) return;

    m.innerText = msg;
    ic.innerText = icon;
    toast.classList.add("show");

    if (window.settleToastTimer) clearTimeout(window.settleToastTimer);
    window.settleToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  window.closeMemberDetailModal = function() {
    const modal = document.getElementById("memberDetailModal");
    if (modal) modal.style.display = "none";
  };

  window.resetPeriodPillActive = function() {
    document.querySelectorAll(".btn-period-pill").forEach(p => p.classList.remove("active"));
  };

  window.setSettleFilterPeriod = function(type, elem) {
    window.resetPeriodPillActive();
    if (elem) elem.classList.add("active");

    const startInput = document.getElementById("settleStartDate");
    const endInput = document.getElementById("settleEndDate");
    const now = new Date();
    const pad = n => (n < 10 ? '0' + n : n);
    const toYmd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    if (type === "all") {
      startInput.value = "";
      endInput.value = "";
    } else if (type === "thisWeek") {
      const day = now.getDay() || 7;
      const mon = new Date(now);
      mon.setDate(now.getDate() - day + 1);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      startInput.value = toYmd(mon);
      endInput.value = toYmd(sun);
    } else if (type === "lastWeek") {
      const day = now.getDay() || 7;
      const lastMon = new Date(now);
      lastMon.setDate(now.getDate() - day - 6);
      const lastSun = new Date(lastMon);
      lastSun.setDate(lastMon.getDate() + 6);
      startInput.value = toYmd(lastMon);
      endInput.value = toYmd(lastSun);
    } else if (type === "thisMonth") {
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      startInput.value = toYmd(first);
      endInput.value = toYmd(last);
    }

    window.calculateSettlementData();
  };

  window.switchSettleTab = function(tab) {
    window.currentSettleTab = tab;
    const btnM = document.getElementById("tabBtnMembers");
    const btnL = document.getElementById("tabBtnLogs");
    const viewM = document.getElementById("settleMembersView");
    const viewL = document.getElementById("settleLogsView");

    if (tab === "members") {
      btnM.classList.add("active");
      btnL.classList.remove("active");
      viewM.style.display = "block";
      viewL.style.display = "none";
    } else {
      btnL.classList.add("active");
      btnM.classList.remove("active");
      viewL.style.display = "block";
      viewM.style.display = "none";
      window.renderLogsListOnly();
    }
  };

  // 🎯 활동 점수 사전 로드 (참여 점수 기준 순위 정렬)
  async function loadGuildMembersActivityPoints() {
    window.settleMemberActivityPoints = {};
    try {
      const [members, raids] = await Promise.all([
        apiRequest("guild_members?select=name"),
        apiRequest("boss_participations?select=members,extra_score")
      ]);

      (members || []).forEach(m => {
        window.settleMemberActivityPoints[m.name] = 0;
      });

      (raids || []).forEach(r => {
        const mems = Array.isArray(r.members) ? r.members : [];
        const score = 1 + (Number(r.extra_score) || 0);
        mems.forEach(name => {
          window.settleMemberActivityPoints[name] = (window.settleMemberActivityPoints[name] || 0) + score;
        });
      });
    } catch (e) {}
  }

  // 🎯 정산 데이터 집계 및 파싱
  window.calculateSettlementData = async function() {
    const listContainer = document.getElementById("settleMemberListContainer");
    if (listContainer) {
      listContainer.innerHTML = '<div class="text-secondary small text-center py-4"><i class="fa-solid fa-spinner fa-spin me-1"></i>데이터를 집계하는 중...</div>';
    }

    await loadGuildMembersActivityPoints();

    const startVal = document.getElementById("settleStartDate").value;
    const endVal = document.getElementById("settleEndDate").value;

    try {
      // item_distributions 테이블에서 정산 데이터 전체 조회
      const data = await apiRequest("item_distributions?select=*&order=id.desc");
      let filtered = data || [];

      // 날짜 필터링
      if (startVal || endVal) {
        filtered = filtered.filter(item => {
          const itemDate = (item.created_at || "").slice(0, 10);
          if (startVal && itemDate < startVal) return false;
          if (endVal && itemDate > endVal) return false;
          return true;
        });
      }

      window.settleRawDistributions = filtered;
      window.settleMemberMap = {};

      let totalPool = 0;

      filtered.forEach(d => {
        const perShare = Number(d.per_share) || 0;
        let mems = [];
        if (Array.isArray(d.members)) {
          mems = d.members;
        } else if (typeof d.members === "string") {
          try {
            mems = JSON.parse(d.members);
          } catch (e) {
            mems = d.members.split(",").map(s => s.trim()).filter(Boolean);
          }
        }

        // 총 배당 풀 합산
        totalPool += (perShare * mems.length);

        mems.forEach(m => {
          if (!window.settleMemberMap[m]) {
            window.settleMemberMap[m] = {
              name: m,
              totalAmount: 0,
              items: []
            };
          }
          window.settleMemberMap[m].totalAmount += perShare;
          window.settleMemberMap[m].items.push({
            boss: d.boss_name || "보스",
            item: d.item_name || "아이템",
            price: Number(d.price) || 0,
            perShare: perShare,
            winner: d.winner_name || d.member_name || "-",
            date: (d.created_at || "").slice(0, 10)
          });
        });
      });

      // UI 요약 갱신
      const memberNames = Object.keys(window.settleMemberMap);
      document.getElementById("totalDistPoolText").innerText = `${totalPool.toLocaleString()} 다이아`;
      document.getElementById("totalMemberCountText").innerText = `${memberNames.length} 명`;

      window.renderMemberListOnly();
      if (window.currentSettleTab === "logs") {
        window.renderLogsListOnly();
      }

    } catch (err) {
      if (listContainer) {
        listContainer.innerHTML = `<div class="text-danger small text-center py-4">집계 실패: ${err.message}</div>`;
      }
    }
  };

  // 🎯 길드원 목록 렌더링 (활동 점수 순위순 정렬)
  window.renderMemberListOnly = function() {
    const container = document.getElementById("settleMemberListContainer");
    if (!container) return;

    const searchKeyword = (document.getElementById("searchSettleMember").value || "").trim().toLowerCase();
    let members = Object.values(window.settleMemberMap);

    if (searchKeyword) {
      members = members.filter(m => m.name.toLowerCase().includes(searchKeyword));
    }

    if (members.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-4">해당 기간 정산 데이터가 없습니다.</div>';
      return;
    }

    // 활동 점수 순위순 정렬 (점수가 동일하면 수령액 순, 그다음 닉네임 가나다순)
    members.sort((a, b) => {
      const pA = window.settleMemberActivityPoints[a.name] || 0;
      const pB = window.settleMemberActivityPoints[b.name] || 0;
      if (pB !== pA) return pB - pA;
      if (b.totalAmount !== a.totalAmount) return b.totalAmount - a.totalAmount;
      return a.name.localeCompare(b.name, 'ko');
    });

    container.innerHTML = members.map((m, idx) => {
      const points = window.settleMemberActivityPoints[m.name] || 0;
      return `
        <div class="member-settle-card" onclick="window.openMemberDetailModal('${m.name}')">
          <div>
            <div class="fw-bold text-white small d-flex align-items-center gap-1">
              <span class="badge" style="background:#1e293b; color:#94a3b8; font-size:0.65rem;">#${idx+1}</span>
              <span>${m.name}</span>
              <span class="text-secondary" style="font-size:0.7rem; font-weight:normal;">(${points}점 / ${m.items.length}건)</span>
            </div>
          </div>
          <div class="text-end">
            <span class="fw-bold text-warning" style="font-size: 0.95rem;">
              ${m.totalAmount.toLocaleString()} 다이아
            </span>
          </div>
        </div>
      `;
    }).join("");
  };

  // 🎯 전체 정산 상세 로그 렌더링
  window.renderLogsListOnly = function() {
    const container = document.getElementById("settleLogListContainer");
    if (!container) return;

    const list = window.settleRawDistributions || [];
    if (list.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-4">정산 내역이 없습니다.</div>';
      return;
    }

    container.innerHTML = list.map(item => {
      const winner = item.winner_name || item.member_name || "-";
      let mems = [];
      if (Array.isArray(item.members)) mems = item.members;
      else if (typeof item.members === "string") {
        try { mems = JSON.parse(item.members); } catch (e) { mems = item.members.split(","); }
      }

      return `
        <div class="p-2 rounded mb-2" style="background:#090e1c; border:1px solid #1b263b; font-size:0.75rem;">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <strong class="text-white">📦 ${item.item_name}</strong>
            <span class="badge" style="background:rgba(56,189,248,0.15); color:#38bdf8;">${item.boss_name}</span>
          </div>
          <div class="d-flex justify-content-between text-secondary">
            <span>낙찰자: <strong class="text-info">${winner}</strong> (${Number(item.price).toLocaleString()} 다이아)</span>
            <span class="text-warning fw-bold">1인당 ${Number(item.per_share).toLocaleString()} 다이아</span>
          </div>
          <div class="text-secondary mt-1 text-truncate" style="font-size:0.7rem;">
            대상자(${mems.length}명): ${mems.join(", ")}
          </div>
        </div>
      `;
    }).join("");
  };

  // 🎯 길드원 상세 내역 팝업 열기
  window.openMemberDetailModal = function(name) {
    const data = window.settleMemberMap[name];
    if (!data) return;

    document.getElementById("detailMemberNameTitle").innerText = `[${name}] 정산 상세 내역`;
    document.getElementById("detailMemberTotalText").innerText = `${data.totalAmount.toLocaleString()} 다이아`;
    document.getElementById("detailMemberCountText").innerText = `${data.items.length} 건`;

    const historyBox = document.getElementById("detailMemberHistoryList");
    historyBox.innerHTML = data.items.map(it => `
      <div class="p-2 rounded mb-1" style="background:#0f172a; border:1px solid #1e293b; font-size:0.73rem;">
        <div class="d-flex justify-content-between text-white">
          <span>📦 ${it.item}</span>
          <strong class="text-warning">+${it.perShare.toLocaleString()} 다이아</strong>
        </div>
        <div class="d-flex justify-content-between text-secondary mt-1" style="font-size:0.68rem;">
          <span>${it.boss} (낙찰: ${it.winner})</span>
          <span>${it.date}</span>
        </div>
      </div>
    `).join("");

    document.getElementById("memberDetailModal").style.display = "flex";
  };

  // 🎯 카카오톡 공유 복사
  window.copySettleToKakao = function() {
    let members = Object.values(window.settleMemberMap);
    if (members.length === 0) {
      return window.showSettleToast("공유할 정산 내역이 없습니다.", "⚠️");
    }

    // 활동 점수 순위순 정렬
    members.sort((a, b) => {
      const pA = window.settleMemberActivityPoints[a.name] || 0;
      const pB = window.settleMemberActivityPoints[b.name] || 0;
      if (pB !== pA) return pB - pA;
      if (b.totalAmount !== a.totalAmount) return b.totalAmount - a.totalAmount;
      return a.name.localeCompare(b.name, 'ko');
    });

    const startVal = document.getElementById("settleStartDate").value;
    const endVal = document.getElementById("settleEndDate").value;
    const periodStr = (startVal || endVal) ? `(${startVal || '시작'} ~ ${endVal || '종료'})` : `(전체 누적)`;
    const totalPoolText = document.getElementById("totalDistPoolText").innerText;

    let text = `[💰 ECLIPSE 길드 정산 결과 보고]\n` +
      `• 정산 기간: ${periodStr}\n` +
      `• 총 분배 금액: ${totalPoolText}\n` +
      `• 수령 인원: ${members.length}명\n\n` +
      `────────────────\n` +
      `[길드원별 수령액 (활동 점수 순위순)]\n`;

    members.forEach((m, idx) => {
      const points = window.settleMemberActivityPoints[m.name] || 0;
      text += `${idx + 1}. ${m.name} (${points}점): ${m.totalAmount.toLocaleString()} 다이아 (${m.items.length}건)\n`;
    });

    text += `────────────────\n` +
      `※ 시스템상 정산 완료된 내역입니다.`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
      window.showSettleToast("정산 결과가 클립보드에 복사되었습니다!", "🎉");
    }
  };

  // 🎯 모듈 초기 실행
  (function initSettleModule() {
    window.calculateSettlementData();
  })();
</script>
