<!-- ==========================================
     [ECLIPSE 길드관리] 보스타임 & 리젠 현황 모듈
     경로: pages/PageTimer.html
     ========================================== -->
<style>
  .timer-card {
    background: rgba(18, 26, 45, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .timer-status-overview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .timer-stat-box {
    background: #090e1c;
    border: 1px solid #1e2c47;
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .timer-stat-val {
    font-size: 1.25rem;
    font-weight: 800;
  }

  .timer-filter-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }
  .btn-timer-filter {
    background: #0d1527;
    border: 1px solid #1e2c47;
    color: #94a3b8;
    font-size: 0.74rem;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-timer-filter.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
  }

  .boss-timer-item {
    position: relative;
    background: #090e1c;
    border: 1px solid #1b263b;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 9px;
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    z-index: 1;
  }
  .boss-timer-item:hover {
    border-color: #38bdf8;
    background: #0d162d;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    z-index: 2;
  }
  .boss-timer-item.is-spawned {
    border-color: rgba(239, 68, 68, 0.6);
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.12) 0%, #090e1c 100%);
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
  }
  .boss-timer-item.is-imminent {
    border-color: rgba(245, 158, 11, 0.5);
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, #090e1c 100%);
  }

  #bossTimerListContainer {
    max-height: 520px;
    overflow-y: auto;
    padding: 4px 2px;
  }
  #bossTimerListContainer::-webkit-scrollbar {
    width: 6px;
  }
  #bossTimerListContainer::-webkit-scrollbar-track {
    background: #080d1a;
    border-radius: 8px;
  }
  #bossTimerListContainer::-webkit-scrollbar-thumb {
    background: #1e2d4a;
    border-radius: 8px;
  }
  #bossTimerListContainer::-webkit-scrollbar-thumb:hover {
    background: #38bdf8;
  }

  .badge-countdown {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.35);
    color: #fbbf24;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .badge-spawned {
    background: rgba(239, 68, 68, 0.25);
    border: 1px solid #ef4444;
    color: #f87171;
    font-size: 0.82rem;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 8px;
    animation: pulseAnim 1.4s infinite;
    white-space: nowrap;
  }
  .badge-waiting {
    background: rgba(148, 163, 184, 0.12);
    border: 1px solid rgba(148, 163, 184, 0.25);
    color: #94a3b8;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }

  @keyframes pulseAnim {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.97); }
    100% { opacity: 1; transform: scale(1); }
  }

  .badge-type-fixed {
    background: rgba(168, 85, 247, 0.18);
    border: 1px solid rgba(168, 85, 247, 0.4);
    color: #c084fc;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .badge-type-cool {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #38bdf8;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
  }

  .btn-cut-now {
    background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
    border: none;
    color: #fff;
    font-weight: 800;
    font-size: 0.74rem;
    padding: 5px 10px;
    border-radius: 7px;
    box-shadow: 0 2px 8px rgba(225, 29, 72, 0.35);
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-cut-now:hover {
    opacity: 0.95;
  }

  .btn-cut-reserve {
    background: #111e38;
    border: 1px solid #3b82f6;
    color: #60a5fa;
    font-weight: 700;
    font-size: 0.74rem;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-cut-reserve:hover {
    background: rgba(59, 130, 246, 0.2);
    color: #fff;
    border-color: #60a5fa;
  }

  .custom-timer-modal-bg {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(6, 10, 20, 0.82);
    backdrop-filter: blur(6px);
    z-index: 999999;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .custom-timer-modal-box {
    background: #0d1527;
    border: 1.5px solid #38bdf8;
    border-radius: 18px;
    width: 100%; max-width: 360px;
    padding: 18px 16px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9);
  }

  .input-custom-timer {
    background-color: #080d1a !important;
    border: 1px solid #233554 !important;
    color: #ffffff !important;
    border-radius: 10px !important;
    padding: 8px 12px !important;
    font-size: 0.85rem !important;
    color-scheme: dark;
  }
  .input-custom-timer:focus {
    border-color: #38bdf8 !important;
    outline: none !important;
  }

  .custom-timer-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #0d1830;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    color: #ffffff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.88rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
  }
  .custom-timer-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.35rem;">⏰</span>

    </div>
    <div class="d-flex gap-1">

      <button type="button" class="btn btn-outline-secondary btn-xs py-1 px-2" style="font-size: 0.74rem;" onclick="window.loadBossTimers()">

  <div class="timer-status-overview">

<div id="timerToastBox" class="custom-timer-toast">
  <span id="timerToastIcon">✅</span>
  <span id="timerToastMsg">알림</span>
</div>

<script>
  window.bossTimerList = [];
  window.timerInterval = null;
  window.currentTimerFilter = 'all';
  window.activeGuildName = "ECLIPSE";
  window.timerToastTimer = null;
  window.currentReservingBoss = null;

  // 🧹 [메모리 클린업 등록]: 페이지를 벗어날 때 카운트다운 타이머 즉시 해제
  window.__currentModuleCleanup = function() {
    if (window.timerInterval) {
      clearInterval(window.timerInterval);
      window.timerInterval = null;
    }
    if (window.timerToastTimer) {
      clearTimeout(window.timerToastTimer);
      window.timerToastTimer = null;
    }
  };

  window.showTimerToast = function(msg, icon = "✅") {
    const toast = document.getElementById("timerToastBox");
    const m = document.getElementById("timerToastMsg");
    const ic = document.getElementById("timerToastIcon");
    if (!toast) return;

    m.innerText = msg;
    ic.innerText = icon;
    toast.classList.add("show");

    if (window.timerToastTimer) clearTimeout(window.timerToastTimer);
    window.timerToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  async function loadConfiguredGuildName() {
    try {
      const cached = sessionStorage.getItem("guild_name");
      if (cached) {
        window.activeGuildName = cached;
        return;
      }
      const res = await apiRequest("guild_settings?key=eq.guild_name");
      if (res && res.length > 0 && res[0].value) {
        window.activeGuildName = res[0].value;
        sessionStorage.setItem("guild_name", res[0].value);
      }
    } catch (e) {
      window.activeGuildName = "ECLIPSE";
    }
  }

  window.loadBossTimers = async function() {
    const container = document.getElementById('bossTimerListContainer');
    if (!container) return;

    try {
      const data = await apiRequest("boss_timers?select=*&order=id.asc");
      window.bossTimerList = data || [];

      const now = new Date();
      window.bossTimerList.forEach(b => {
        if (b.is_fixed && b.fixed_schedule) {
          b.next_spawn_time = calculateNextDayFixedSpawn(b.fixed_schedule, now);
        }
      });

      window.renderBossTimers();
    } catch (err) {
      container.innerHTML = `<div class="text-danger small text-center py-3">조회 실패: ${err.message}</div>`;
    }
  };

  function calculateNextDayFixedSpawn(schedStr, now) {
    if (!schedStr) return null;
    const parts = schedStr.trim().split(' ');
    if (parts.length < 2) return null;

    const dayName = parts[0];
    const [h, m] = parts[1].split(':').map(Number);
    const dayMap = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };

    if (dayName === '매일') {
      const cand = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      if (cand > now) return cand.toISOString();
      const nextDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, h, m, 0);
      return nextDay.toISOString();
    } else if (dayMap[dayName] !== undefined) {
      const targetDay = dayMap[dayName];
      const currentDay = now.getDay();
      let dayDiff = (targetDay - currentDay + 7) % 7;

      let cand = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayDiff, h, m, 0);
      if (dayDiff === 0 && cand <= now) {
        cand = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7, h, m, 0);
      }
      return cand.toISOString();
    }
    return null;
  }

  window.renderBossTimers = function() {
    const container = document.getElementById('bossTimerListContainer');
    if (!container) return;

    if (window.bossTimerList.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-4">등록된 보스 목록이 없습니다. 설정창에서 보스를 등록해보세요.</div>';
      return;
    }

    const now = Date.now();
    let countSpawned = 0;
    let countImminent = 0;
    let countNormal = 0;

    window.bossTimerList.forEach(b => {
      if (!b.next_spawn_time) {
        countNormal++;
        return;
      }
      const diffSec = Math.floor((new Date(b.next_spawn_time).getTime() - now) / 1000);
      if (diffSec <= 0) countSpawned++;
      else if (diffSec <= 3600) countImminent++;
      else countNormal++;
    });

    document.getElementById('statSpawnedCount').innerText = countSpawned;
    document.getElementById('statImminentCount').innerText = countImminent;
    document.getElementById('statNormalCount').innerText = countNormal;

    window.bossTimerList.sort((a, b) => {
      const tA = a.next_spawn_time ? new Date(a.next_spawn_time).getTime() : 9999999999999;
      const tB = b.next_spawn_time ? new Date(b.next_spawn_time).getTime() : 9999999999999;
      return tA - tB;
    });

    const filtered = window.bossTimerList.filter(b => {
      if (window.currentTimerFilter === 'all') return true;
      if (window.currentTimerFilter === 'fixed') return b.is_fixed;
      if (window.currentTimerFilter === 'cool') return !b.is_fixed;
      if (window.currentTimerFilter === 'imminent') {
        if (!b.next_spawn_time) return false;
        const diff = (new Date(b.next_spawn_time).getTime() - now) / 1000;
        return diff <= 3600;
      }
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-4">선택한 필터 조건에 해당하는 보스가 없습니다.</div>';
      return;
    }

    container.innerHTML = filtered.map(b => {
      let typeBadge = '';
      let actionArea = '';
      let infoLine = '';
      let cardExtraClass = '';

      const diffSec = b.next_spawn_time ? Math.floor((new Date(b.next_spawn_time).getTime() - now) / 1000) : 999999;
      if (diffSec <= 0) cardExtraClass = 'is-spawned';
      else if (diffSec <= 3600) cardExtraClass = 'is-imminent';

      if (b.is_fixed) {
        typeBadge = `<span class="badge-type-fixed">🏛️ 고정 젠</span>`;
        actionArea = `<span class="badge bg-dark text-secondary border border-secondary border-opacity-25" style="font-size: 0.72rem; padding: 5px 8px;">스케줄 자동</span>`;
        infoLine = `<span>스케줄: <strong class="text-white">${b.fixed_schedule}</strong></span>`;
      } else {
        const cycleHours = Math.floor(b.cycle_min / 60);
        const cycleMins = b.cycle_min % 60;
        const cycleStr = (cycleHours > 0 ? cycleHours + '시간 ' : '') + (cycleMins > 0 ? cycleMins + '분' : '');

        typeBadge = `<span class="badge-type-cool">⚔️ 쿨 ${cycleStr}</span>`;
        actionArea = `
          <div class="d-flex gap-1">
            <button type="button" class="btn-cut-now" onclick="window.recordCutNow(${b.id}, '${b.boss_name}',${b.cycle_min})">
              <i class="fa-solid fa-skull me-1"></i>지금 컷
            </button>
            <button type="button" class="btn-cut-reserve" onclick="window.openReserveCutModal(${b.id}, '${b.boss_name}',${b.cycle_min})">
              <i class="fa-solid fa-clock-rotate-left me-1"></i>컷 예약
            </button>
          </div>
        `;

        const lastCutStr = b.last_cut_time ? formatDisplayTime(b.last_cut_time) : '기록 없음';
        infoLine = `<span>최근 컷: <strong>${lastCutStr}</strong></span>`;
      }

      const nextGenStr = b.next_spawn_time ? formatDisplayTime(b.next_spawn_time) : '미정 (컷 필요)';

      return `
        <div class="boss-timer-item ${cardExtraClass}">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <span class="fw-bold text-white fs-6">${b.boss_name}</span>
              <span class="ms-2">${typeBadge}</span>
            </div>
            <div>${actionArea}</div>
          </div>
          
          <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-25">
            <div class="text-secondary small" style="font-size: 0.73rem; line-height: 1.5;">
              ${infoLine}<br>
              <span>다음 젠: <strong class="text-info">${nextGenStr}</strong></span>
            </div>
            <div id="countdown-${b.id}">
              <span class="badge-waiting">계산 중...</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    window.updateCountdowns();
  };

  function formatDisplayTime(isoStr) {
    if (!isoStr) return '-';
    const d = new Date(isoStr);
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
    const pad = n => (n < 10 ? '0' + n : n);
    return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}(${dayNames[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  window.updateCountdowns = function() {
    const now = Date.now();

    window.bossTimerList.forEach(b => {
      const cdElem = document.getElementById(`countdown-${b.id}`);
      if (!cdElem) return;

      if (!b.next_spawn_time) {
        cdElem.innerHTML = `<span class="badge-waiting">컷 대기</span>`;
        return;
      }

      const spawnTime = new Date(b.next_spawn_time).getTime();
      const diffSec = Math.floor((spawnTime - now) / 1000);

      if (diffSec <= 0) {
        const passedMin = Math.floor(Math.abs(diffSec) / 60);
        cdElem.innerHTML = `<span class="badge-spawned">🚨 젠 완료 (+${passedMin}분)</span>`;
      } else {
        const hours = Math.floor(diffSec / 3600);
        const mins = Math.floor((diffSec % 3600) / 60);
        const secs = diffSec % 60;
        const timeStr = `${hours > 0 ? hours + '시간 ' : ''}${mins}분 ${secs}초`;
        cdElem.innerHTML = `<span class="badge-countdown">⏳ ${timeStr}</span>`;
      }
    });
  };

  window.recordCutNow = async function(id, bossName, cycleMin) {
    const cutTime = new Date();
    const nextSpawn = new Date(cutTime.getTime() + (cycleMin * 60 * 1000));

    try {
      await apiRequest(`boss_timers?id=eq.${id}`, "PATCH", {
        last_cut_time: cutTime.toISOString(),
        next_spawn_time: nextSpawn.toISOString()
      });

      window.showTimerToast(`[${bossName}] 지금 컷 처리 완료! 다음 젠이 계산되었습니다.`, "⚔️");
      await window.loadBossTimers();
    } catch (err) {
      window.showTimerToast("컷 등록 실패: " + err.message, "❌");
    }
  };

  window.openReserveCutModal = function(id, bossName, cycleMin) {
    window.currentReservingBoss = { id, bossName, cycleMin };
    document.getElementById("reserveTargetBossName").innerText = bossName;
    
    const cycleHours = Math.floor(cycleMin / 60);
    const cycleMins = cycleMin % 60;
    const cycleStr = (cycleHours > 0 ? cycleHours + '시간 ' : '') + (cycleMins > 0 ? cycleMins + '분' : '');
    document.getElementById("reserveTargetBossCycle").innerText = `쿨타임 ${cycleStr}`;

    window.quickAdjustCutTime(0);
    document.getElementById("modalReserveCut").style.display = "flex";
  };

  window.closeReserveCutModal = function() {
    document.getElementById("modalReserveCut").style.display = "none";
    window.currentReservingBoss = null;
  };

  window.quickAdjustCutTime = function(offsetMinutes) {
    const targetDate = new Date(Date.now() + (offsetMinutes * 60 * 1000));
    const kstLocalStr = typeof getKSTDateTimeLocalString === "function" 
      ? getKSTDateTimeLocalString(targetDate) 
      : targetDate.toISOString().slice(0, 16);
    
    document.getElementById("reserveCutDatetimeInput").value = kstLocalStr;
    window.previewNextSpawnFromInput();
  };

  window.previewNextSpawnFromInput = function() {
    if (!window.currentReservingBoss) return;
    const inputVal = document.getElementById("reserveCutDatetimeInput").value;
    if (!inputVal) {
      document.getElementById("reservePreviewNextSpawnText").innerText = "-";
      return;
    }

    const cutDate = new Date(inputVal);
    const nextSpawnDate = new Date(cutDate.getTime() + (window.currentReservingBoss.cycleMin * 60 * 1000));
    document.getElementById("reservePreviewNextSpawnText").innerText = formatDisplayTime(nextSpawnDate.toISOString());
  };

  window.confirmReserveCutAction = async function() {
    if (!window.currentReservingBoss) return;
    const inputVal = document.getElementById("reserveCutDatetimeInput").value;
    if (!inputVal) return window.showTimerToast("컷 일시를 선택해주세요.", "⚠️");

    const cutDate = new Date(inputVal);
    const nextSpawnDate = new Date(cutDate.getTime() + (window.currentReservingBoss.cycleMin * 60 * 1000));

    try {
      await apiRequest(`boss_timers?id=eq.${window.currentReservingBoss.id}`, "PATCH", {
        last_cut_time: cutDate.toISOString(),
        next_spawn_time: nextSpawnDate.toISOString()
      });

      window.showTimerToast(`[${window.currentReservingBoss.bossName}] 컷 예약이 반영되었습니다!`, "🎉");
      window.closeReserveCutModal();
      await window.loadBossTimers();
    } catch (err) {
      window.showTimerToast("예약 실패: " + err.message, "❌");
    }
  };

  window.setTimerFilter = function(filterType) {
    window.currentTimerFilter = filterType;
    document.querySelectorAll(".btn-timer-filter").forEach(b => b.classList.remove("active"));
    
    const btnMap = {
      all: 'fBtnAll',
      imminent: 'fBtnImminent',
      cool: 'fBtnCool',
      fixed: 'fBtnFixed'
    };
    if (btnMap[filterType]) {
      const activeBtn = document.getElementById(btnMap[filterType]);
      if (activeBtn) activeBtn.classList.add("active");
    }

    window.renderBossTimers();
  };

  window.copyTimersForKakao = function() {
    if (window.bossTimerList.length === 0) return window.showTimerToast("공유할 보스타임 데이터가 없습니다.", "⚠️");

    const now = Date.now();
    const gName = window.activeGuildName || "길드";

    const lines = window.bossTimerList.map(b => {
      if (!b.next_spawn_time) {
        return `• ${b.boss_name}: 컷 대기`;
      }

      const d = new Date(b.next_spawn_time);
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const pad = n => (n < 10 ? '0' + n : n);
      const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}(${dayNames[d.getDay()]})`;
      const diffSec = Math.floor((d.getTime() - now) / 1000);

      let status = '';
      if (diffSec <= 0) {
        const passedMin = Math.floor(Math.abs(diffSec) / 60);
        status = `[🚨 젠 됨 (+${passedMin}분)]`;
      } else {
        const h = Math.floor(diffSec / 3600);
        const m = Math.floor((diffSec % 3600) / 60);
        status = `[⏳ ${h > 0 ? h + '시간 ' : ''}${m}분 남음]`;
      }

      return `• ${b.boss_name} (${timeStr})${status}`;
    });

    const shareText = `[⏰ ${gName} 보스타임 & 리젠 현황]\n────────────────────\n${lines.join('\n')}\n────────────────────\n※ 카톡 봇 및 웹앱 실시간 연동 중`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(() => {
        window.showTimerToast("보스타임 현황이 클립보드에 복사되었습니다!", "📋");
      });
    } else {
      window.showTimerToast("보스타임 현황이 클립보드에 복사되었습니다!", "📋");
    }
  };

  (async function initBossTimerPage() {
    await loadConfiguredGuildName();
    await window.loadBossTimers();
    if (window.timerInterval) clearInterval(window.timerInterval);
    window.timerInterval = setInterval(window.updateCountdowns, 1000);
  })();
</script>
