<script>
  window.aucListCache = [];
  window.aucUnsettledDrops = [];
  window.aucCurrentFilter = "open";
  window.aucCountdownTimer = null;
  window.aucToastTimer = null;
  window.aucDefaultMinInc = 10;
  window.aucGuildName = "불편한사람들";

  window.__currentModuleCleanup = function() {
    if (window.aucCountdownTimer) {
      clearInterval(window.aucCountdownTimer);
      window.aucCountdownTimer = null;
    }
    if (window.aucToastTimer) {
      clearTimeout(window.aucToastTimer);
      window.aucToastTimer = null;
    }
  };

  window.showAucToast = function(msg, icon = "✅") {
    const t = document.getElementById("aucToastBox");
    if (!t) return;
    document.getElementById("aucToastMsg").innerText = msg;
    document.getElementById("aucToastIcon").innerText = icon;
    t.classList.add("show");
    if (window.aucToastTimer) clearTimeout(window.aucToastTimer);
    window.aucToastTimer = setTimeout(() => t.classList.remove("show"), 2500);
  };

  window.checkAuctionManagePermission = async function() {
    const isAuth = (typeof isAdminLoggedIn === "function") ? isAdminLoggedIn() : (sessionStorage.getItem("admin_auth") === "true");
    if (!isAuth) return false;

    const isSuper = (sessionStorage.getItem("admin_role") === "super");
    if (isSuper) return true;

    try {
      const rows = await apiRequest("guild_settings?key=eq.perm_settings_auction");
      if (rows && rows.length > 0 && rows[0].value === "false") {
        return false;
      }
    } catch (e) {}
    return true;
  };

  window.loadAuctionMetaSettings = async function() {
    try {
      const rows = await apiRequest("guild_settings?key=in.(guild_name,auction_min_increment)");
      (rows || []).forEach(r => {
        if (r.key === "guild_name" && r.value) window.aucGuildName = r.value;
        if (r.key === "auction_min_increment" && r.value) {
          const parsed = parseInt(r.value, 10);
          window.aucDefaultMinInc = (!isNaN(parsed) && parsed >= 10) ? parsed : 10;
          const incInput = document.getElementById("aucNewMinInc");
          if (incInput) incInput.value = window.aucDefaultMinInc;
        }
      });
    } catch (e) {}
  };

  window.loadUnsettledDropItemsForAuction = async function() {
    const sel = document.getElementById("aucUnsettledDropSelect");
    if (!sel) return;

    try {
      const [settledRows, raidsRows, openAucRows] = await Promise.all([
        apiRequest("item_distributions?select=item_key").catch(() => []),
        apiRequest("boss_participations?select=*&order=id.desc&limit=80").catch(() => []),
        apiRequest("guild_auctions?select=source_item_key&status=in.(open,closed,pending_approval,approved)").catch(() => [])
      ]);

      const settledSet = new Set((settledRows || []).map(s => s.item_key));
      const inAucSet = new Set((openAucRows || []).map(a => a.source_item_key).filter(Boolean));
      window.aucUnsettledDrops = [];

      (raidsRows || []).forEach(r => {
        if (!r.drop_items || r.drop_items === "없음") return;
        const items = r.drop_items.split(",").map(s => s.trim()).filter(Boolean);
        let mems = Array.isArray(r.members) ? r.members : [];

        items.forEach((itemName, idx) => {
          const itemKey = `${r.id}_${idx}_${itemName}`;
          if (!settledSet.has(itemKey) && !inAucSet.has(itemKey)) {
            window.aucUnsettledDrops.push({
              itemKey,
              raidId: r.id,
              bossName: r.boss_name || "보스",
              itemName,
              members: mems
            });
          }
        });
      });

      sel.innerHTML = '<option value="">직접 입력 (또는 미정산 보스 드랍템 선택)...</option>' +
        window.aucUnsettledDrops.map((d, i) => `<option value="${i}">[${d.bossName}] ${d.itemName} (참여 ${d.members.length}명)</option>`).join('');
    } catch (e) {}
  };

  window.onSelectUnsettledDropItem = function() {
    const sel = document.getElementById("aucUnsettledDropSelect");
    const idx = sel.value;
    if (idx === "") return;
    const item = window.aucUnsettledDrops[parseInt(idx, 10)];
    if (!item) return;

    document.getElementById("aucNewItemName").value = item.itemName;
    document.getElementById("aucNewBossName").value = item.bossName;
  };

  window.setAuctionEndPreset = function(minutes) {
    const target = new Date(Date.now() + minutes * 60 * 1000);
    const fmt = (typeof getKSTDateTimeLocalString === "function")
      ? getKSTDateTimeLocalString(target)
      : target.toISOString().slice(0, 16);
    document.getElementById("aucNewEndTime").value = fmt;
  };

  window.toggleCreateAuctionForm = async function() {
    const allowed = await window.checkAuctionManagePermission();
    if (!allowed) {
      return window.showAucToast("경매 등록은 관리자만 이용할 수 있습니다.", "🔒");
    }

    const box = document.getElementById("createAuctionFormBox");
    const isOpening = (box.style.display === "none" || !box.style.display);
    box.style.display = isOpening ? "block" : "none";

    if (isOpening) {
      window.setAuctionEndPreset(60);
      await window.loadUnsettledDropItemsForAuction();
      setTimeout(() => document.getElementById("aucNewItemName")?.focus(), 100);
    }
  };

  window.submitCreateAuction = async function() {
    const allowed = await window.checkAuctionManagePermission();
    if (!allowed) return window.showAucToast("경매 등록은 관리자만 가능합니다.", "🔒");

    const itemName = document.getElementById("aucNewItemName").value.trim();
    const bossName = document.getElementById("aucNewBossName").value.trim();
    const mode = document.getElementById("aucNewMode").value;
    const startPrice = parseInt(document.getElementById("aucNewStartPrice").value, 10) || 10;
    const minInc = parseInt(document.getElementById("aucNewMinInc").value, 10) || 10;
    const endTimeVal = document.getElementById("aucNewEndTime").value;

    if (!itemName) return window.showAucToast("경매 아이템명을 입력해주세요!", "⚠️");
    if (startPrice < 10 || startPrice % 10 !== 0) {
      return window.showAucToast("시작가는 10 다이아 단위로 입력해주세요. (예: 10, 100, 500)", "⚠️");
    }
    if (minInc < 10 || minInc % 10 !== 0) {
      return window.showAucToast("최소 호가 단위는 10 다이아 단위로 입력해주세요.", "⚠️");
    }
    if (!endTimeVal) return window.showAucToast("경매 마감 일시를 선택해주세요!", "⚠️");

    const endDate = new Date(endTimeVal);
    if (isNaN(endDate.getTime()) || endDate.getTime() <= Date.now()) {
      return window.showAucToast("마감 시각은 현재 시각 이후로 설정해야 합니다.", "⚠️");
    }

    const dropIdx = document.getElementById("aucUnsettledDropSelect").value;
    const linkedDrop = (dropIdx !== "") ? window.aucUnsettledDrops[parseInt(dropIdx, 10)] : null;

    const btn = document.getElementById("btnSubmitCreateAuction");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>등록 중...';

    try {
      await apiRequest("guild_auctions", "POST", [{
        item_name: itemName,
        boss_name: bossName,
        source_item_key: linkedDrop ? linkedDrop.itemKey : "",
        raid_id: linkedDrop ? linkedDrop.raidId : null,
        participants: linkedDrop ? linkedDrop.members : [],
        auction_mode: mode,
        start_price: startPrice,
        min_increment: minInc,
        current_price: startPrice,
        bid_count: 0,
        status: "open",
        end_time: endDate.toISOString()
      }]);

      document.getElementById("aucNewItemName").value = "";
      document.getElementById("aucNewBossName").value = "";
      document.getElementById("aucUnsettledDropSelect").value = "";
      document.getElementById("createAuctionFormBox").style.display = "none";

      window.showAucToast(`[${itemName}] 익명 경매가 시작되었습니다!`, "🔨");
      await window.loadGuildAuctions();
      if (typeof window.refreshAuctionFloatingButton === "function") {
        window.refreshAuctionFloatingButton();
      }
    } catch (err) {
      window.showAucToast("경매 등록 실패: " + err.message, "❌");
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-gavel me-1"></i> 익명 경매 시작하기';
    }
  };

  window.setAuctionFilter = function(filter) {
    window.aucCurrentFilter = filter;
    ["open", "closed", "all"].forEach(k => {
      const btn = document.getElementById(`aucTab_${k}`);
      if (btn) btn.classList.toggle("active", k === filter);
    });
    window.renderAuctionList();
  };

  window.loadGuildAuctions = async function() {
    const container = document.getElementById("auctionListContainer");
    const canManage = await window.checkAuctionManagePermission();
    const createBtn = document.getElementById("btnToggleCreateAuction");
    if (createBtn) createBtn.style.display = canManage ? "inline-block" : "none";

    try {
      const data = await apiRequest("rpc/get_guild_auctions_safe", "POST", {
        p_is_admin: canManage
      });
      window.aucListCache = Array.isArray(data) ? data : [];
      window.renderAuctionList(canManage);
    } catch (err) {
      if (container) {
        container.innerHTML = `<div class="text-danger small text-center py-4">경매 조회 실패: ${err.message}</div>`;
      }
    }
  };

  window.renderAuctionList = function(canManageFlag) {
    const container = document.getElementById("auctionListContainer");
    if (!container) return;

    const isAdmin = (canManageFlag !== undefined)
      ? canManageFlag
      : ((typeof isAdminLoggedIn === "function") ? isAdminLoggedIn() : (sessionStorage.getItem("admin_auth") === "true"));

    const now = Date.now();
    const filtered = window.aucListCache.filter(a => {
      const isOpen = (a.status === "open") && (new Date(a.end_time).getTime() > now);
      if (window.aucCurrentFilter === "open") return isOpen;
      if (window.aucCurrentFilter === "closed") return !isOpen;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-4">해당 조건의 경매 내역이 없습니다.</div>';
      return;
    }

    container.innerHTML = filtered.map(a => {
      const endMs = new Date(a.end_time).getTime();
      const isOpen = (a.status === "open") && (endMs > now);
      const isApproved = (a.status === "approved" || a.status === "settled");
      const isPendingApproval = !isOpen && !isApproved && (a.bid_count > 0);
      const isBlind = (a.auction_mode === "blind");

      const modeBadge = isBlind
        ? `<span class="auc-badge-mode-blind">🙈 비공개 블라인드</span>`

      const bossBadge = a.boss_name
        ? `<span class="badge bg-dark text-info border border-info border-opacity-25" style="font-size:0.68rem;">${a.boss_name}</span>`

      let priceLabel = "현재 최고 입찰가";
      let priceValText = `${Number(a.current_price || a.start_price).toLocaleString()} <small class="fs-6 text-light">D</small>`;
      if (a.bid_count === 0) {
        priceLabel = "경매 시작가 (입찰 대기)";
      } else if (isPendingApproval) {
        priceLabel = "마감 최고 입찰가 (승인 대기중)";
      } else if (isApproved) {
        priceLabel = "최종 승인 낙찰가";
      }

      if (isBlind && !isApproved && !isAdmin) {
        priceLabel = isOpen ? "블라인드 진행중 (시작가)" : "블라인드 입찰 마감 (승인 대기중)";
        priceValText = `${Number(a.start_price).toLocaleString()} <small class="fs-6 text-light">D ~ (비공개)</small>`;
      }

      const incUnit = Math.max(10, Number(a.min_increment) || 10);
      const nextMinBid = (a.bid_count === 0)
        ? Number(a.start_price)
        : (Number(a.current_price) + incUnit);

      let statusBodyHtml = "";
      if (isOpen) {
        statusBodyHtml = `
          <div class="p-2 rounded mt-2" style="background: #060a14; border: 1px solid #1e2c47;">
            <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-1">
              <span class="text-secondary" style="font-size: 0.7rem;">
                ${isBlind ? `시작가 ${Number(a.start_price).toLocaleString()}D 이상 (10D 단위)` : `최소 입찰: <strong class="text-info">${nextMinBid.toLocaleString()} D</strong> (단위 +${incUnit}D)`}
              </span>
              <div class="d-flex gap-1">
                <button type="button" class="btn-quick-inc" onclick="window.setQuickBidAmount(${a.id}, ${nextMinBid})">최소가</button>
                <button type="button" class="btn-quick-inc" onclick="window.addQuickBidAmount(${a.id}, 10, ${nextMinBid})">+10</button>
                <button type="button" class="btn-quick-inc" onclick="window.addQuickBidAmount(${a.id}, 50, ${nextMinBid})">+50</button>
                <button type="button" class="btn-quick-inc" onclick="window.addQuickBidAmount(${a.id}, 100, ${nextMinBid})">+100</button>
              </div>
            </div>
            <div class="row g-1 align-items-center">
              <div class="col-4">
                <input type="password" id="aucPin_${a.id}" class="form-control input-custom-auc text-center" placeholder="개인 PIN" maxlength="12" inputmode="numeric">
              </div>
              <div class="col-5">
                <input type="number" id="aucAmt_${a.id}" class="form-control input-custom-auc text-end no-spin" step="10" value="${isBlind ? Number(a.start_price) : nextMinBid}" placeholder="10D 단위 입력">
              </div>
              <div class="col-3">
                <button type="button" class="btn btn-warning btn-sm w-100 fw-bold text-dark" style="height: 38px; font-size: 0.78rem; white-space: nowrap;" onclick="window.submitAuctionBid(${a.id})">
                  입찰
                </button>
              </div>
            </div>
          </div>
        `;
      } else if (isPendingApproval) {
        statusBodyHtml = `
          <div class="p-2 rounded mt-2 d-flex justify-content-between align-items-center flex-wrap gap-2" style="background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.45); font-size: 0.78rem;">
            <span class="text-warning fw-bold">
              ⏳ 입찰 마감 — ${isAdmin ? `최고 입찰자: <span class="text-info">${a.winner_name}</span> (${Number(a.current_price).toLocaleString()} D)` : '관리자 낙찰 승인 대기중'}
            </span>
            ${isAdmin ? `
              <button type="button" class="btn btn-success btn-sm py-1 px-2 fw-bold" style="font-size: 0.74rem; white-space: nowrap;" onclick="window.approveAuctionWinner(${a.id}, '${a.item_name}', '${a.winner_name}', ${Number(a.current_price)})">
                ✅ 낙찰 승인
              </button>
            ` : ''}
          </div>
        `;
      } else if (isApproved) {
        statusBodyHtml = `
          <div class="p-2 rounded mt-2 d-flex justify-content-between align-items-center flex-wrap gap-1" style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.4); font-size: 0.78rem;">
            <span class="text-success fw-bold">
              🏆 최종 낙찰 확정: ${a.winner_name || '익명 낙찰자'} (${Number(a.current_price).toLocaleString()} D)
            </span>
            ${a.status === 'settled' ? '<span class="badge bg-info text-dark">정산/금고 반영완료</span>' : ''}
          </div>
        `;
      } else {
        statusBodyHtml = `
          <div class="p-2 rounded mt-2 text-secondary small" style="background: rgba(148, 163, 184, 0.08); border: 1px solid #334155; font-size: 0.76rem;">
            유찰됨 (입찰 참여자 없음)
          </div>
        `;
      }

      const bids = Array.isArray(a.bids) ? a.bids : [];
      const bidsHtml = bids.length > 0 ? `
        <div class="auc-bid-log-list">
          <div class="text-secondary mb-1" style="font-size: 0.68rem;">📜 입찰 현황 (총 ${a.bid_count}건)</div>
          ${bids.map((b, i) => `
            <div class="auc-bid-row">
              <span class="${i === 0 ? 'text-warning fw-bold' : 'text-secondary'}">
                ${i === 0 ? '👑 ' : ''}${b.bidder_name}
              </span>
              <span class="${i === 0 ? 'text-warning fw-bold' : 'text-light'}">
                ${Number(b.bid_amount).toLocaleString()} D
              </span>
            </div>
          `).join('')}
        </div>
      ` : (isBlind && !isApproved && !isAdmin
        ? `<div class="text-secondary mt-2" style="font-size:0.72rem;">🙈 비공개 블라인드 경매입니다. 현재 총 <strong>${a.bid_count}건</strong>의 입찰이 접수되었습니다.</div>`
        : `<div class="text-secondary mt-2" style="font-size:0.72rem;">아직 입찰 내역이 없습니다.</div>`);

      const adminToolsHtml = isAdmin ? `
        <div class="mt-2 pt-2 border-top border-secondary border-opacity-25 d-flex justify-content-end gap-1 flex-wrap">
          ${isOpen ? `<button type="button" class="btn btn-outline-warning btn-xs py-1 px-2" style="font-size:0.7rem;" onclick="window.closeAuctionEarly(${a.id}, '${a.item_name}')">입찰 즉시 마감</button>` : ''}
          ${(a.status === 'approved' && a.bid_count > 0 && Array.isArray(a.participants) && a.participants.length > 0)
            ? `<button type="button" class="btn btn-outline-info btn-xs py-1 px-2 fw-bold" style="font-size:0.7rem;" onclick="window.openAuctionSettleModal(${a.id})">🎁 N/1 정산 & 금고 반영</button>`
            : ''}
          <button type="button" class="btn btn-outline-danger btn-xs py-1 px-2" style="font-size:0.7rem;" onclick="window.deleteAuctionItem(${a.id}, '${a.item_name}')">삭제</button>
        </div>
      ` : "";

      let pillClass = "";
      let pillText = "계산중...";
      if (!isOpen) {
        if (isPendingApproval) {
          pillClass = "pending";
          pillText = "⏳ 낙찰 승인 대기";
        } else if (isApproved) {
          pillClass = "ended";
          pillText = "✅ 낙찰 확정";
        } else {
          pillClass = "nobid";
          pillText = "유찰 마감";
        }
      }

      const cardClass = isOpen ? "is-open" : (isPendingApproval ? "is-pending" : "is-closed");

      return `
        <div class="auc-item-card ${cardClass}">
          <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
            <div style="min-width:0; flex:1;">
              <div class="d-flex align-items-center gap-1 flex-wrap mb-1">
                ${modeBadge}
                ${bossBadge}

              <div class="fw-bold text-white fs-6 text-truncate">${a.item_name}</div>
            </div>
            <span class="auc-timer-pill ${pillClass}" id="aucTimer_${a.id}" data-end="${a.end_time}" data-closed="${isOpen ? '0' : '1'}">
              ${pillText}
            </span>
          </div>

            <div>
              <div class="text-secondary" style="font-size: 0.7rem;">${priceLabel}</div>
              <div class="fw-bold text-warning fs-5">${priceValText}</div>
            </div>
            <div class="text-end">
              <div class="text-secondary" style="font-size: 0.7rem;">총 입찰</div>
              <div class="fw-bold text-info small">${a.bid_count}회</div>
            </div>
          </div>

          ${statusBodyHtml}
          ${bidsHtml}
          ${adminToolsHtml}
        </div>
      `;
    }).join('');

    window.updateAuctionCountdowns();
  };

  window.updateAuctionCountdowns = function() {
    const now = Date.now();
    let justExpired = false;

    document.querySelectorAll("[id^='aucTimer_']").forEach(el => {
      if (el.getAttribute("data-closed") === "1") return;
      const endMs = new Date(el.getAttribute("data-end")).getTime();
      const diffSec = Math.floor((endMs - now) / 1000);
      if (diffSec <= 0) {
        el.innerText = "입찰 마감";
        el.classList.add("pending");
        el.setAttribute("data-closed", "1");
        justExpired = true;
        return;
      }
      const h = Math.floor(diffSec / 3600);
      const m = Math.floor((diffSec % 3600) / 60);
      const s = diffSec % 60;
      const pad = n => (n < 10 ? "0" + n : n);
      el.innerText = `⏳ ${h > 0 ? h + ':' : ''}${pad(m)}:${pad(s)}`;
    });

    if (justExpired) {
      window.loadGuildAuctions();
      if (typeof window.refreshAuctionFloatingButton === "function") {
        window.refreshAuctionFloatingButton();
      }
    }
  };

  window.setQuickBidAmount = function(aucId, amount) {
    const el = document.getElementById(`aucAmt_${aucId}`);
    if (el) el.value = amount;
  };

  window.addQuickBidAmount = function(aucId, inc, minVal) {
    const el = document.getElementById(`aucAmt_${aucId}`);
    if (!el) return;
    const cur = parseInt(el.value, 10) || minVal;
    const nextVal = Math.max(minVal, cur + inc);
    el.value = Math.ceil(nextVal / 10) * 10;
  };

  window.submitAuctionBid = async function(aucId) {
    const pinEl = document.getElementById(`aucPin_${aucId}`);
    const amtEl = document.getElementById(`aucAmt_${aucId}`);
    const pin = (pinEl?.value || "").trim();
    const amount = parseInt(amtEl?.value || "0", 10);

    if (!pin || pin.length < 4) {
      return window.showAucToast("개인 비밀번호(PIN) 4자리 이상을 입력해주세요.", "⚠️");
    }
    if (!amount || amount < 10) {
      return window.showAucToast("입찰할 다이아 금액을 입력해주세요.", "⚠️");
    }
    if (amount % 10 !== 0) {
      return window.showAucToast("입찰 금액은 10 다이아 단위로만 입력할 수 있습니다.", "⚠️");
    }

    try {
      const res = await apiRequest("rpc/place_guild_auction_bid", "POST", {
        p_auction_id: aucId,
        p_member_pin: pin,
        p_bid_amount: amount
      });

      if (!res || !res.success) {
        return window.showAucToast(res?.message || "입찰 처리 실패", "❌");
      }

      if (pinEl) pinEl.value = "";
      const extMsg = res.extended ? " (마감 임박 자동 연장됨!)" : "";
      window.showAucToast(`✅ 익명 입찰 완료! (${Number(amount).toLocaleString()} D)${extMsg}`, "🔨");
      await window.loadGuildAuctions();
    } catch (err) {
      window.showAucToast("입찰 오류: " + err.message, "❌");
    }
  };

  window.closeAuctionEarly = async function(aucId, itemName) {
    if (!confirm(`[${itemName}] 입찰을 지금 즉시 마감하고 낙찰 승인 대기 상태로 전환하시겠습니까?`)) return;
    try {
      await apiRequest(`guild_auctions?id=eq.${aucId}`, "PATCH", {
        status: "pending_approval",
        end_time: new Date().toISOString()
      });
      window.showAucToast(`[${itemName}] 입찰이 마감되었습니다. 낙찰 승인을 진행해주세요.`, "⏳");
      await window.loadGuildAuctions();
      if (typeof window.refreshAuctionFloatingButton === "function") {
        window.refreshAuctionFloatingButton();
      }
    } catch (err) {
      window.showAucToast("마감 실패: " + err.message, "❌");
    }
  };

  window.approveAuctionWinner = async function(aucId, itemName, winnerName, price) {
    const allowed = await window.checkAuctionManagePermission();
    if (!allowed) return window.showAucToast("낙찰 승인은 관리자만 가능합니다.", "🔒");

    const confirmMsg = `[✅ 최종 낙찰 승인]\n` +
      `• 경매 물품: ${itemName}\n` +
      `• 최종 낙찰자: ${winnerName}\n` +
      `• 최종 낙찰가: ${Number(price).toLocaleString()} 다이아\n\n` +
      `이대로 최종 낙찰을 승인하시겠습니까?`;

    if (!confirm(confirmMsg)) return;

    try {
      await apiRequest(`guild_auctions?id=eq.${aucId}`, "PATCH", {
        status: "approved"
      });
      window.showAucToast(`🎉 [${itemName}] 최종 낙찰이 승인되었습니다!`, "✅");
      await window.loadGuildAuctions();
    } catch (err) {
      window.showAucToast("낙찰 승인 실패: " + err.message, "❌");
    }
  };

  window.deleteAuctionItem = async function(aucId, itemName) {
    if (!confirm(`[${itemName}] 경매 기록을 삭제하시겠습니까?`)) return;
    try {
      await apiRequest(`guild_auctions?id=eq.${aucId}`, "DELETE");
      window.showAucToast(`[${itemName}] 삭제 완료`, "🗑️");
      await window.loadGuildAuctions();
      if (typeof window.refreshAuctionFloatingButton === "function") {
        window.refreshAuctionFloatingButton();
      }
    } catch (err) {
      window.showAucToast("삭제 실패: " + err.message, "❌");
    }
  };

  window.openAuctionSettleModal = function(aucId) {
    const auc = window.aucListCache.find(a => a.id === aucId);
    if (!auc) return;

    document.getElementById("settleAucId").value = auc.id;
    const mems = Array.isArray(auc.participants) ? auc.participants : [];
    document.getElementById("settleAucSummaryText").innerHTML = `
      <div>• <strong>아이템:</strong> [${auc.boss_name || '보스'}] ${auc.item_name}</div>
      <div>• <strong>최종 낙찰자:</strong> <span class="text-info fw-bold">${auc.winner_name}</span></div>
      <div>• <strong>낙찰 금액:</strong> <span class="text-warning fw-bold">${Number(auc.current_price).toLocaleString()} 다이아</span></div>
      <div>• <strong>N/1 분배 대상:</strong> 참여자 ${mems.length}명</div>
    `;
    document.getElementById("modalAuctionSettle").style.display = "flex";
  };

  window.closeAuctionSettleModal = function() {
    document.getElementById("modalAuctionSettle").style.display = "none";
  };

  window.confirmAuctionSettle = async function() {
    const aucId = parseInt(document.getElementById("settleAucId").value, 10);
    const auc = window.aucListCache.find(a => a.id === aucId);
    if (!auc) return;

    const taxApplied = document.getElementById("settleAucTaxMode").value === "true";
    const feeRate = parseInt(document.getElementById("settleAucGuildFee").value, 10) || 0;
    const price = Number(auc.current_price) || 0;
    const mems = Array.isArray(auc.participants) ? auc.participants : [];

    if (mems.length === 0) {
      return window.showAucToast("분배 대상 참여자 명단이 없습니다.", "⚠️");
    }

    const gameTax = taxApplied ? Math.floor(price * 0.05) : 0;
    const netAuctionPrice = price - gameTax;
    const guildFee = Math.floor(netAuctionPrice * (feeRate / 100));
    const pool = netAuctionPrice - guildFee;
    const perShare = Math.floor(pool / mems.length);
    const itemKey = auc.source_item_key || `AUC_${auc.id}_${auc.item_name}`;

    const btn = document.getElementById("btnConfirmAucSettle");
    btn.disabled = true;

    try {
      const res = await apiRequest("rpc/process_wish_distribution_transaction", "POST", {
        p_item_key: itemKey,
        p_boss_name: auc.boss_name || "길드경매",
        p_item_name: auc.item_name,
        p_winner_name: auc.winner_name,
        p_price: price,
        p_per_share: perShare,
        p_members: mems,
        p_net_auction_price: netAuctionPrice,
        p_distribution_pool: pool,
        p_member_count: mems.length,
        p_created_at: new Date().toISOString()
      });

      if (!res || !res.success) {
        throw new Error(res?.error || "정산 반영 중 오류 발생");
      }

      await apiRequest(`guild_auctions?id=eq.${auc.id}`, "PATCH", { status: "settled" });

      window.closeAuctionSettleModal();
      window.showAucToast(`🎉 낙찰 정산 완료! (1인당 ${perShare.toLocaleString()} D)`, "🎉");
      await window.loadGuildAuctions();
    } catch (err) {
      window.showAucToast("정산 실패: " + err.message, "❌");
    } finally {
      btn.disabled = false;
    }
  };

  window.copyActiveAuctionsToKakao = function() {
    const now = Date.now();
    const openList = window.aucListCache.filter(a => a.status === "open" && new Date(a.end_time).getTime() > now);
    if (openList.length === 0) {
      return window.showAucToast("현재 진행 중인 경매가 없습니다.", "⚠️");
    }

    const lines = openList.map(a => {
      const modeStr = a.auction_mode === "blind" ? "비공개 블라인드" : `현재가 ${Number(a.current_price).toLocaleString()}D`;
      return `• [${a.boss_name || '경매'}] ${a.item_name} (${modeStr} / 입찰 ${a.bid_count}회)`;
    });

    const text = `🔨 [${window.aucGuildName} 익명 경매 진행 안내]\n──────────────────\n${lines.join('\n')}\n──────────────────\n길드 관리 웹 [길드경매] 버튼에서 개인 비밀번호(PIN)로 10D 단위 익명 입찰하세요!`;
    navigator.clipboard.writeText(text);
    window.showAucToast("진행 중인 경매 공지가 복사되었습니다!", "📋");
  };

  (async function initAuctionModule() {
    await window.loadAuctionMetaSettings();
    await window.loadGuildAuctions();
    if (window.aucCountdownTimer) clearInterval(window.aucCountdownTimer);
    window.aucCountdownTimer = setInterval(window.updateAuctionCountdowns, 1000);
  })();
</script>
